<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Copiloto · Supervisor</title>
<meta name="theme-color" content="#0f6b4f">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#eef0ea; --fg:#1b1f1a; --muted:#5e665c; --line:#cfd5c9; --panel:#ffffff;
  --accent:#0f6b4f; --accent-fg:#ffffff;
  --ok:#1d7a3a; --warn:#b26a00; --bad:#b3261e; --calm:#2b5f9e;
  --ok-soft:#dff3e3; --warn-soft:#fdebcc; --bad-soft:#fadcda; --calm-soft:#dde8f5; --none-soft:#e6e8e3;
  --display:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141714; --fg:#e8ebe5; --muted:#9aa396; --line:#2b312a; --panel:#1c201c;
  --accent:#2fbf8a; --accent-fg:#06281b;
  --ok:#5fd68a; --warn:#f0b457; --bad:#f08a82; --calm:#7fb0ea;
  --ok-soft:#163d24; --warn-soft:#3f2f10; --bad-soft:#44201d; --calm-soft:#1b2d44; --none-soft:#232823; color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--display);font-size:15px;line-height:1.4;padding-top:env(safe-area-inset-top,0px)}
header{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--accent-fg);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
header h1{font-size:16px;font-weight:600;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:transparent;border:1px solid rgba(255,255,255,.4);color:inherit;border-radius:8px;padding:5px 9px;font:inherit;font-size:13px}
main{padding:14px max(16px,env(safe-area-inset-right,0px)) 90px max(16px,env(safe-area-inset-left,0px));max-width:720px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs a{flex:1;text-align:center;padding:10px 4px 8px;text-decoration:none;color:var(--muted);font-size:12.5px;font-weight:500}
nav.tabs a.on{color:var(--accent)}
nav.tabs a b{display:block;font-size:18px;font-weight:400}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card.tap{cursor:pointer}
.card.tap:active{opacity:.8}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
.name{font-weight:600}
.sub{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.calm{background:var(--calm-soft);color:var(--calm)}.pill.none{background:var(--none-soft);color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kpi b{display:block;font-size:20px;font-weight:600;font-family:var(--mono)}
.kpi span{font-size:11.5px;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.btn{background:transparent;color:var(--accent);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font:inherit;font-size:13.5px;font-weight:500;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn:disabled{opacity:.5}
input,select,textarea{width:100%;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.err{color:var(--bad);font-size:13.5px;margin-top:8px}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.day{border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center;font-size:11px;color:var(--muted)}
.day b{display:block;font-family:var(--mono);font-size:12px;color:var(--fg)}
.day.ok{border-color:var(--ok);background:var(--ok-soft)}.day.warn{border-color:var(--warn);background:var(--warn-soft)}.day.bad{border-color:var(--bad);background:var(--bad-soft)}
.day span{display:block;font-size:14px;line-height:1.2}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px;font:inherit;font-size:13px;color:var(--muted)}
.seg button.on{border-color:var(--accent);color:var(--accent);font-weight:500}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.hint{font-size:12.5px;color:var(--muted)}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
.bar{height:6px;background:var(--none-soft);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
/* venta: avance por tramo, barras por día (scroll horizontal) y detalle del día */
:root{--t-base:#8b938a;--t-medio:var(--calm);--t-alto:var(--accent);--t-sp:var(--warn)}
.prog{margin-top:10px}.prog:first-child{margin-top:0}
.prog .bar{position:relative;height:8px;overflow:visible}
.prog .bar i{border-radius:3px}
.prog .bar i.s-medio{background:var(--t-medio)}.prog .bar i.s-alto{background:var(--t-alto)}
.prog .bar em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.55}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chart{display:flex;align-items:flex-end;gap:3px;overflow-x:auto;padding:4px 2px 6px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.col{flex:0 0 36px;background:transparent;border:1px solid transparent;border-radius:8px;padding:3px 0 4px;font:inherit;color:var(--fg);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.col.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent)}
.col .n{font-family:var(--mono);font-size:12px;font-weight:500;min-height:16px}
.col .stack{width:20px;height:92px;display:flex;flex-direction:column;justify-content:flex-end;border-bottom:2px solid var(--line)}
.col .stack i{display:block;width:100%}
.col .stack i:first-child{border-radius:3px 3px 0 0}
.col .d{font-size:10.5px;color:var(--muted);line-height:1.15;text-align:center}
.col .d b{display:block;font-family:var(--mono);font-size:11.5px;color:var(--fg);font-weight:500}
.col.finde .d{color:var(--warn)}
.col .th{font-size:9.5px;font-family:var(--mono);color:var(--muted);min-height:12px}
.s-base{background:var(--t-base)}.s-medio{background:var(--t-medio)}.s-alto{background:var(--t-alto)}.s-sp{background:var(--t-sp)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .q{font-family:var(--mono);font-size:16px;font-weight:600;min-width:28px;text-align:right}
.item .dot{width:9px;height:9px;border-radius:2px;flex:none}
.item .grow{flex:1;min-width:0}
.mbar{height:5px;background:var(--none-soft);border-radius:3px;margin-top:4px;overflow:hidden}
.mbar i{display:block;height:100%}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:9}
</style>
</head>
<body>
<header><h1 id="title">Copiloto · Supervisor</h1><button id="btn-out" hidden>Salir</button></header>
<main id="app"></main>
<nav class="tabs" id="tabs" hidden>
  <a href="#cartera" data-t="cartera"><b>👥</b>Cartera</a>
  <a href="#alertas" data-t="alertas"><b>🔔</b>Alertas</a>
  <a href="#tablero" data-t="tablero"><b>📊</b>Tablero</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPA_URL='https://noskbefdrtayhwydlbfx.supabase.co';
const SUPA_KEY='sb_publishable_5aLhvx4RAy5yqmRuLz4-zg_ZfuEppFV';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
const $=s=>document.querySelector(s);
const S={user:null, editor:false, supervisores:[], supSel:null, cartera:null, alertas:null, tablero:null, ficha:null, filtro:'abiertas', ventas:null, vT:0, vDia:null, vTodos:false};
const G={4:['Super Premium','s-sp','warn'],3:['Tramo Alto','s-alto','ok'],2:['Tramo Medio','s-medio','calm'],1:['Tramo Base','s-base','none'],0:['Motothings','','none'],'-1':['Sin tramo','','none']};
const DOW=['dom','lun','mar','mié','jue','vie','sáb'];
const dt=f=>new Date(f+'T12:00:00');
const n0=x=>Math.round(Number(x)||0);
const Q={reconocer:['Reconocer','ok'],destrabar:['Destrabar','warn'],visitar:['Visitar primero','bad'],no_intervenir:['No intervenir','calm'],sin_datos:['Sin datos aún','none']};
const SEV={alta:'bad',media:'warn',baja:'none',positiva:'ok'};
const EST={abierta:['Abierta','bad'],pendiente:['Pospuesta','warn'],en_gestion:['En gestión','warn'],escalada:['Escalada','calm'],cerrada:['Cerrada','ok']};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>s?s.charAt(0)+s.slice(1).toLowerCase():'';
const nice=s=>String(s||'').split(' ').map(cap).join(' ');
const fecha=d=>d?new Date(d).toLocaleDateString('es-CL',{day:'2-digit',month:'short'}):'';
const hora=d=>d?new Date(d).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}):'';
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200);}
async function rpc(fn,args){const {data,error}=await sb.rpc(fn,args||{});if(error)throw error;return data;}
function errMsg(e){const m=(e&&(e.message||e.msg))||String(e);if(/Usuario sin acceso/.test(m))return 'Tu usuario no tiene acceso a esta aplicación. Pide a Motorola que lo habilite.';if(/sin cartera/.test(m))return 'Tu usuario no está ligado a una cartera de supervisor todavía.';if(/Invalid login/.test(m))return 'Correo o clave incorrectos.';return m;}
function supArgs(){return S.editor&&S.supSel?{p_supervisor:S.supSel}:{};}

// ---------- vistas ----------
function viewLogin(msg){
  $('#tabs').hidden=true;$('#btn-out').hidden=true;
  $('#app').innerHTML=`<div class="card" style="margin-top:30px"><div class="name" style="font-size:18px">Entrar</div><p class="hint">La misma cuenta que usas en la app de metas.</p>
  <form id="f-login"><label for="l-email">Correo</label><input id="l-email" type="email" autocomplete="username" required><label for="l-pass">Clave</label><input id="l-pass" type="password" autocomplete="current-password" required>
  <div class="btns"><button class="btn primary" type="submit">Entrar</button></div><div class="err" id="l-err">${esc(msg||'')}</div></form></div>`;
  $('#f-login').onsubmit=async e=>{e.preventDefault();$('#l-err').textContent='';try{const {error}=await sb.auth.signInWithPassword({email:$('#l-email').value.trim(),password:$('#l-pass').value});if(error)throw error;await afterLogin();}catch(err){$('#l-err').textContent=errMsg(err);}};
}
function selectorSup(){
  if(!S.editor)return '';
  return `<label for="sel-sup">Ver como</label><select id="sel-sup"><option value="">Todas las zonas</option>${S.supervisores.map(s=>`<option value="${s.persona_id}" ${S.supSel==s.persona_id?'selected':''}>${esc(nice(s.nombre_asignacion))}</option>`).join('')}</select>`;
}
async function viewCartera(){
  nav('cartera');
  $('#app').innerHTML=`${selectorSup()}<div class="empty">Cargando cartera…</div>`;
  bindSel();
  try{ S.cartera=await rpc('sup_cartera',{p_fecha:new Date().toISOString().slice(0,10),...supArgs()}); }catch(e){$('#app').innerHTML+=`<div class="err">${esc(errMsg(e))}</div>`;return;}
  const g={};S.cartera.forEach(p=>{(g[p.cuadrante]=g[p.cuadrante]||[]).push(p);});
  const orden=['visitar','destrabar','no_intervenir','reconocer','sin_datos'];
  const resumen=`<div class="kpis">${orden.filter(k=>k!=='sin_datos').map(k=>`<div class="kpi"><b>${(g[k]||[]).length}</b><span>${Q[k][0]}</span></div>`).join('')}</div>
  <p class="hint">${S.cartera.length} promotores · ${(g.sin_datos||[]).length} sin datos del copiloto todavía. Engagement = turnos con botón tocado en los últimos 5; ritmo = venta MotoTalk contra lo que necesita para el 70%.</p>`;
  const card=p=>`<div class="card tap" data-p="${p.persona_id}"><div class="row"><div class="grow"><div class="name">${esc(nice(p.nombre_pila))} <span class="sub" style="display:inline">· ${esc(nice(p.persona).split(' ').slice(-2).join(' '))}</span></div><div class="sub">${esc(nice(p.tienda))} · ${esc(p.cuenta)}${S.editor&&!S.supSel?` · ${esc(nice(p.supervisor))}`:''}</div></div>
    <div style="text-align:right"><span class="pill ${Q[p.cuadrante][1]}">${Q[p.cuadrante][0]}</span>${p.alertas_abiertas>0?`<div class="sub num">🔔 ${p.alertas_abiertas}</div>`:''}</div></div>
    <div class="row" style="margin-top:8px;gap:14px"><div class="sub num">👆 ${p.toques_5}/${p.turnos_5}</div><div class="sub num">✅ ${p.cumplidos_5}/${p.compromisos_5}</div><div class="grow"><div class="sub num">ritmo ${p.ritmo??'—'}% · ${p.venta_periodo} de ${p.meta_total??'—'}</div><div class="bar"><i style="width:${Math.min(100,p.ritmo||0)}%"></i></div></div></div></div>`;
  $('#app').innerHTML=selectorSup()+resumen+orden.filter(k=>g[k]).map(k=>`<div class="eyebrow">${Q[k][0]} · ${g[k].length}</div>`+g[k].map(card).join('')).join('');
  bindSel(); document.querySelectorAll('.card.tap').forEach(c=>c.onclick=()=>location.hash='#promotor/'+c.dataset.p);
}
function bindSel(){const s=$('#sel-sup');if(s)s.onchange=()=>{S.supSel=s.value?+s.value:null;route();};}
function diaClass(d){ if(d.seguimiento==='cumplio')return 'ok'; if(d.toco&&d.compromiso)return 'warn'; if(!d.toco)return 'bad'; return ''; }
function diaIcon(d){ if(d.marco===false)return '⏰'; if(d.seguimiento==='cumplio')return '✅'; if(d.toco&&d.compromiso)return '🤝'; if(d.toco)return '👆'; return '·'; }
// ---------- venta en la ficha ----------
function ventaHTML(){
  const V=S.ventas||[]; if(!V.length) return '<div class="card hint">Sin tienda vigente: no hay venta que mostrar.</div>';
  const t=V[S.vT]||V[0], m=t.meta, a=t.acum, per=t.periodo, pila=nice(S.ficha.persona.nombre_pila);
  const seg=V.length>1?`<div class="seg">${V.map((x,i)=>`<button data-vt="${i}" class="${i===S.vT?'on':''}">${esc(nice(x.tienda))}</button>`).join('')}</div>`:'';
  const prog=(lbl,val,meta,cls,mark,nota)=>`<div class="prog"><div class="row"><div class="grow">${lbl}</div><div class="num"><b>${n0(val)}</b> de ${meta??'—'}${meta?` · ${Math.round(100*val/meta)}%`:''}</div></div>
    <div class="bar"><i class="${cls}" style="width:${meta?Math.min(100,100*val/meta):0}%"></i>${mark?`<em style="left:${mark}%"></em>`:''}</div>${nota?`<div class="hint" style="margin-top:3px">${nota}</div>`:''}</div>`;
  let notaLlave='';
  if(m){ const falta=m.llave-n0(a.tel); notaLlave=falta<=0?'Pozo Variable abierto (pasó el 70%).':`Faltan ${falta} para la llave del 70% (${m.llave})${per.dias_restantes>0?`: ${(falta/per.dias_restantes).toFixed(1)} al día en los ${per.dias_restantes} días que quedan`:''}.`; }
  const resumen=`<div class="card">${m?prog('Volumen (Pozo Variable)',a.tel,m.total,'',70,notaLlave)+prog('Tramo Medio',a.medio,m.medio,'s-medio')+prog('Tramo Alto',a.alto,m.alto,'s-alto'):`<div><b class="num">${n0(a.tel)}</b> equipos en ${esc(per.nombre)} · sin meta cargada</div>`}
    <div class="chips"><span class="pill warn">Super Premium ${n0(a.sp)}</span><span class="pill none">Motothings ${n0(a.things)}</span>${n0(a.sin_tramo)?`<span class="pill none">Sin tramo ${n0(a.sin_tramo)}</span>`:''}</div>
    ${t.n_promotores>1?`<div class="hint" style="margin-top:8px">Tienda con ${t.n_promotores} promotores: la meta y la venta son de la tienda. A nombre de ${esc(pila)}: ${n0(a.propias)} de ${n0(a.tel)+n0(a.things)+n0(a.sin_tramo)}.</div>`:(n0(a.propias)<n0(a.tel)+n0(a.things)+n0(a.sin_tramo)?`<div class="hint" style="margin-top:8px">${n0(a.propias)} de ${n0(a.tel)+n0(a.things)+n0(a.sin_tramo)} unidades están a nombre de ${esc(pila)} en MotoTalk; el resto las cargó otra persona.</div>`:'')}</div>`;
  const dias=t.dias||[], mx=Math.max(1,...dias.map(d=>n0(d.tel)));
  if(!S.vDia||!dias.some(d=>d.fecha===S.vDia)){ const con=dias.filter(d=>n0(d.tel)+n0(d.things)+n0(d.sin_tramo)>0); S.vDia=(con.length?con[con.length-1]:dias[dias.length-1]||{}).fecha||null; }
  const col=d=>{const D=dt(d.fecha), fin=[0,6].includes(D.getDay()); const h=k=>Math.round(92*n0(d[k])/mx);
    return `<button type="button" class="col ${d.fecha===S.vDia?'on':''} ${fin?'finde':''}" data-dia="${d.fecha}" aria-label="${DOW[D.getDay()]} ${D.getDate()}: ${n0(d.tel)} equipos"><span class="n">${n0(d.tel)||''}</span>
      <span class="stack">${['sp','alto','medio','base'].filter(k=>n0(d[k])>0).map(k=>`<i class="s-${k}" style="height:${Math.max(3,h(k))}px"></i>`).join('')}</span>
      <span class="d">${DOW[D.getDay()]}<b>${D.getDate()}</b></span><span class="th">${n0(d.things)?'+'+n0(d.things):''}</span></button>`;};
  const prom=dias.length?(dias.reduce((s,d)=>s+n0(d.tel),0)/dias.length).toFixed(1):'0';
  const chart=`<div class="card"><div class="row"><div class="grow name">Día a día</div><div class="sub num">${prom} equipos/día</div></div>
    <div class="chart" id="chart">${dias.map(col).join('')}</div>
    <div class="legend"><span><i class="s-sp"></i>Super Premium</span><span><i class="s-alto"></i>Alto</span><span><i class="s-medio"></i>Medio</span><span><i class="s-base"></i>Base</span><span>+n = Motothings</span></div></div>`;
  const dsel=dias.find(d=>d.fecha===S.vDia), det=(t.detalle||[]).filter(x=>x.fecha===S.vDia);
  const item=(x,max)=>`<div class="item"><span class="dot ${G[x.rango][1]||''}" style="${G[x.rango][1]?'':'background:var(--line)'}"></span><div class="grow"><div>${esc(x.modelo)}</div><div class="sub">${G[x.rango][0]}${x.propias!=null&&n0(x.propias)<n0(x.u)?` · ${n0(x.propias)} a su nombre`:''}${n0(x.retro)?` · ${n0(x.retro)} cargada${n0(x.retro)>1?'s':''} después`:''}</div>${max?`<div class="mbar"><i class="${G[x.rango][1]||'s-base'}" style="width:${Math.round(100*n0(x.u)/max)}%"></i></div>`:''}</div><div class="q">${n0(x.u)}</div></div>`;
  let diaCard='';
  if(dsel){ const D=dt(dsel.fecha), tot=n0(dsel.tel);
    diaCard=`<div class="card"><div class="row"><div class="grow name">${cap(DOW[D.getDay()])} ${D.getDate()} · ${tot} equipo${tot===1?'':'s'}${n0(dsel.things)?` + ${n0(dsel.things)} Motothings`:''}</div></div>
      ${det.length?det.map(x=>item(x)).join(''):'<div class="hint" style="margin-top:6px">Sin venta registrada en MotoTalk ese día.</div>'}
      ${n0(dsel.max_fila)>=10?`<div class="hint" style="margin-top:8px">⚠️ Una sola carga de ${n0(dsel.max_fila)} unidades: posible masivo.</div>`:''}</div>`; }
  const mods=t.modelos||[], mmax=Math.max(1,...mods.map(x=>n0(x.u))), lim=S.vTodos?mods:mods.slice(0,6);
  const mesCard=`<div class="card"><div class="row"><div class="grow name">Qué ha vendido en ${esc(per.nombre)}</div><div class="sub num">${mods.length} modelos</div></div>
    ${lim.map(x=>item({...x,propias:null,retro:0},mmax)).join('')||'<div class="hint" style="margin-top:6px">Sin venta en el período.</div>'}
    ${mods.length>6?`<div class="btns"><button class="btn" id="v-todos">${S.vTodos?'Ver menos':`Ver los ${mods.length}`}</button></div>`:''}</div>`;
  return seg+resumen+chart+diaCard+mesCard;
}
function bindVentas(scroll){
  const box=$('#ventas'); if(!box) return;
  box.querySelectorAll('[data-dia]').forEach(b=>b.onclick=()=>{const ch=$('#chart'), sl=ch?ch.scrollLeft:0; S.vDia=b.dataset.dia; box.innerHTML=ventaHTML(); bindVentas(false); const c2=$('#chart'); if(c2) c2.scrollLeft=sl;});
  box.querySelectorAll('[data-vt]').forEach(b=>b.onclick=()=>{S.vT=+b.dataset.vt; S.vDia=null; S.vTodos=false; box.innerHTML=ventaHTML(); bindVentas(true);});
  const vt=$('#v-todos'); if(vt) vt.onclick=()=>{S.vTodos=!S.vTodos; const ch=$('#chart'), sl=ch?ch.scrollLeft:0; box.innerHTML=ventaHTML(); bindVentas(false); const c2=$('#chart'); if(c2) c2.scrollLeft=sl;};
  if(scroll){ const ch=$('#chart'), on=ch&&ch.querySelector('.col.on'); if(on) ch.scrollLeft=on.offsetLeft-ch.clientWidth/2; }
}
async function viewFicha(id){
  nav('cartera');
  $('#app').innerHTML='<div class="empty">Cargando ficha…</div>';
  const hoy=new Date().toISOString().slice(0,10);
  S.ventas=null; S.vT=0; S.vDia=null; S.vTodos=false;
  try{ [S.ficha,S.ventas]=await Promise.all([rpc('sup_ficha',{p_persona:+id,p_fecha:hoy}), rpc('sup_ventas',{p_persona:+id,p_fecha:hoy}).catch(()=>null)]); }catch(e){$('#app').innerHTML=`<div class="err">${esc(errMsg(e))}</div><div class="btns"><a class="btn" href="#cartera">Volver</a></div>`;return;}
  const f=S.ficha, p=f.persona;
  const dias=f.dias.slice(0,20);
  const abiertas=f.alertas.filter(a=>['abierta','pendiente','en_gestion','escalada'].includes(a.estado));
  const objeciones={}, prefieren={};
  f.dias.forEach(d=>{if(d.objecion)objeciones[d.objecion]=(objeciones[d.objecion]||0)+1; if(d.prefiere)prefieren[d.prefiere]=(prefieren[d.prefiere]||0)+1;});
  $('#app').innerHTML=`<a class="btn" href="#cartera" style="display:inline-block;margin-bottom:10px">‹ Cartera</a>
  <div class="card"><div class="name" style="font-size:18px">${esc(nice(p.nombre_pila))} <span class="sub" style="display:inline">${esc(nice(p.nombre))}</span></div><div class="sub">${esc(nice(p.tienda||''))} · ${esc(p.cuenta||'')}</div>
  <div class="hint" style="margin-top:6px">${p.consentimiento?`Consentimiento ${fecha(p.consentimiento)}`:'Sin consentimiento registrado'}${p.baja?` · <b>BAJA ${fecha(p.baja)}</b>`:''}</div></div>
  ${abiertas.length?`<div class="eyebrow">Alertas abiertas</div>${abiertas.map(cardAlerta).join('')}`:''}
  <div class="eyebrow">Venta · MotoTalk</div><div id="ventas">${S.ventas?ventaHTML():'<div class="card hint">No se pudo cargar la venta.</div>'}</div>
  <div class="eyebrow">Copiloto · últimos ${dias.length} turnos</div>
  <div class="card">${dias.length?'':'<div class="hint">Sin datos del copiloto todavía.</div>'}<div class="strip">${dias.map(d=>`<div class="day ${diaClass(d)}" title="${esc(d.escenario||'')}"><b>${fecha(d.fecha).replace('.','')}</b><span>${diaIcon(d)}</span>${d.venta!=null?`<span class="num" style="font-size:11px">${d.venta}</span>`:''}</div>`).join('')}</div>
  <p class="hint">✅ cumplió · 🤝 se comprometió · 👆 tocó · ⏰ sin marcación · número = venta MotoTalk del día</p></div>
  <div class="eyebrow">Lo que dice</div>
  <div class="card">${Object.keys(objeciones).length?`<div><b>Objeciones:</b> ${Object.entries(objeciones).map(([k,v])=>`${esc(k)} (${v})`).join(', ')}</div>`:''}
  ${Object.keys(prefieren).length?`<div><b>Modelos que le piden:</b> ${Object.entries(prefieren).map(([k,v])=>`${esc(k)} (${v})`).join(', ')}</div>`:''}
  ${f.dias.filter(d=>d.dificil||d.tarde).length?`<div><b>Motivos de días difíciles:</b> ${[...new Set(f.dias.flatMap(d=>[d.dificil,d.tarde]).filter(Boolean))].map(esc).join(', ')}</div>`:''}
  ${!Object.keys(objeciones).length&&!Object.keys(prefieren).length&&!f.dias.filter(d=>d.dificil||d.tarde).length?'<span class="hint">Todavía no registra objeciones ni motivos.</span>':''}</div>
  <div class="eyebrow">Historial de alertas (90 días)</div>
  ${f.alertas.filter(a=>a.estado==='cerrada').map(cardAlerta).join('')||'<div class="card hint">Sin alertas cerradas.</div>'}`;
  bindAlertas(); bindVentas(true);
}
function cardAlerta(a){
  const open=['abierta','pendiente'].includes(a.estado), ges=a.estado==='en_gestion';
  const who=a.nombre_pila?`<div class="name">${esc(nice(a.nombre_pila))} <span class="sub" style="display:inline">· ${esc(nice(a.tienda||''))}</span></div>`:'';
  return `<div class="card" data-a="${a.id}">${who}<div class="row"><div class="grow"><div class="${who?'':'name'}">${esc(a.titulo)}</div></div><span class="pill ${SEV[a.severidad]}">${a.severidad}</span><span class="pill ${EST[a.estado][1]}">${EST[a.estado][0]}</span></div>
  <div class="sub" style="white-space:normal;margin-top:4px">${esc(a.detalle||'')}</div>
  ${a.accion?`<div style="margin-top:4px">→ ${esc(a.accion)}</div>`:''}
  <div class="hint" style="margin-top:4px">${fecha(a.abierta_en)} ${hora(a.abierta_en)}${a.gestion?` · ${esc(a.gestion)} ${hora(a.gestion_en)}`:''}${a.resultado?` · ${esc(a.resultado)}`:''}${a.nota?` · <i>${esc(a.nota)}</i>`:''}</div>
  ${open?`<div class="btns">${a.severidad==='positiva'?`<button class="btn primary" data-act="reconocido">Se lo digo yo</button>`:`<button class="btn primary" data-act="llamo">Lo llamo</button><button class="btn" data-act="visito">Lo visito</button><button class="btn" data-act="escalo">Escalo</button>`}<button class="btn" data-act="pospuesta">Después</button><button class="btn" data-act="no_aplica">No aplica</button></div>`:''}
  ${ges?`<div class="btns"><button class="btn primary" data-act="resuelto">Resuelto</button><button class="btn" data-act="sigue">Sigue igual</button><button class="btn" data-act="pide_ayuda">Necesito ayuda</button></div>`:''}</div>`;
}
function bindAlertas(){
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{
    const id=+b.closest('[data-a]').dataset.a, act=b.dataset.act; let nota=null;
    if(act==='no_aplica'||act==='pide_ayuda'||act==='sigue'){ nota=prompt(act==='no_aplica'?'¿Por qué no aplica? (ayuda a ajustar la regla)':'Una línea de contexto (opcional)'); if(act==='no_aplica'&&nota===null)return; }
    b.disabled=true;
    try{ await rpc('sup_alerta_gestionar',{p_id:id,p_accion:act,p_nota:nota||null}); toast('Anotado'); route(); }catch(e){toast(errMsg(e));b.disabled=false;}
  });
}
async function viewAlertas(){
  nav('alertas');
  $('#app').innerHTML=`${selectorSup()}<div class="seg">${['abiertas','cerrada'].map(k=>`<button data-f="${k}" class="${S.filtro===k?'on':''}">${k==='abiertas'?'Abiertas':'Cerradas'}</button>`).join('')}</div><div class="empty" id="al-list">Cargando…</div>`;
  bindSel(); document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.filtro=b.dataset.f;viewAlertas();});
  try{ S.alertas=await rpc('sup_alertas',{p_estado:S.filtro,...supArgs()}); }catch(e){$('#al-list').innerHTML=`<div class="err">${esc(errMsg(e))}</div>`;return;}
  const grp=k=>S.alertas.filter(a=>a.estado===k);
  const secs=S.filtro==='abiertas'?[['abierta','Por responder'],['pendiente','Pospuestas'],['en_gestion','En gestión: ¿cómo te fue?'],['escalada','Escaladas']]:[['cerrada','Cerradas']];
  $('#al-list').outerHTML=secs.filter(([k])=>grp(k).length).map(([k,t])=>`<div class="eyebrow">${t} · ${grp(k).length}</div>`+grp(k).map(cardAlerta).join('')).join('')||'<div class="empty">Nada por aquí.</div>';
  bindAlertas();
}
async function viewTablero(){
  nav('tablero');
  $('#app').innerHTML=`${selectorSup()}<div class="empty">Cargando…</div>`; bindSel();
  try{ S.tablero=await rpc('sup_tablero',{p_desde:new Date(Date.now()-28*864e5).toISOString().slice(0,10),...supArgs()}); if(!S.cartera) S.cartera=await rpc('sup_cartera',{p_fecha:new Date().toISOString().slice(0,10),...supArgs()}); }catch(e){$('#app').innerHTML+=`<div class="err">${esc(errMsg(e))}</div>`;return;}
  const t=S.tablero, pct=(a,b)=>b?Math.round(100*a/b)+'%':'—';
  const c=S.cartera, con=c.filter(p=>p.turnos_5>0);
  const eng=con.length?(con.reduce((s,p)=>s+p.toques_5,0)/con.length).toFixed(1):'—';
  const cump=con.reduce((s,p)=>s+p.compromisos_5,0); const cumpl=con.reduce((s,p)=>s+p.cumplidos_5,0);
  $('#app').innerHTML=selectorSup()+`<div class="eyebrow">Alertas · últimas 4 semanas</div>
  <div class="kpis"><div class="kpi"><b>${t.recibidas}</b><span>recibidas</span></div><div class="kpi"><b>${pct(t.atendidas_24h,t.recibidas)}</b><span>atendidas en 24 h</span></div><div class="kpi"><b>${pct(t.resueltas,t.gestionadas)}</b><span>resueltas / gestionadas</span></div><div class="kpi"><b>${t.no_aplica}</b><span>no aplica</span></div></div>
  <p class="hint">${t.abiertas} abiertas ahora · ${t.pide_ayuda} con ayuda pedida al coordinador.${t.no_aplica>=3?' Varias "no aplica": conviene revisar las reglas de tu zona.':''}</p>
  <div class="eyebrow">Cartera · últimos 5 turnos</div>
  <div class="kpis"><div class="kpi"><b>${eng}</b><span>toques por promotor (de 5)</span></div><div class="kpi"><b>${pct(cumpl,cump)}</b><span>compromisos cumplidos</span></div><div class="kpi"><b>${c.filter(p=>p.cuadrante==='visitar').length}</b><span>en Visitar primero</span></div><div class="kpi"><b>${c.filter(p=>p.cuadrante==='reconocer').length}</b><span>en Reconocer</span></div></div>
  <p class="hint">${con.length} de ${c.length} promotores con datos del copiloto. El tablero sale solo de cómo respondes las alertas; no hay nada que llenar.</p>`;
}

// ---------- navegación ----------
function nav(t){$('#tabs').hidden=false;$('#btn-out').hidden=false;document.querySelectorAll('nav.tabs a').forEach(a=>a.classList.toggle('on',a.dataset.t===t));}
function route(){
  if(!S.user)return viewLogin();
  const h=location.hash||'#cartera';
  if(h.startsWith('#promotor/'))return viewFicha(h.split('/')[1]);
  if(h==='#alertas')return viewAlertas();
  if(h==='#tablero')return viewTablero();
  return viewCartera();
}
async function afterLogin(){
  const {data}=await sb.auth.getUser(); S.user=data.user;
  try{ const r=await sb.rpc('sup_actual'); if(r.error)throw r.error; S.editor=r.data===null; }catch(e){ S.user=null; await sb.auth.signOut(); return viewLogin(errMsg(e)); }
  if(S.editor){ try{ S.supervisores=await rpc('sup_lista'); }catch(e){ S.supervisores=[]; } }
  $('#title').textContent=S.editor?'Copiloto · Supervisores':'Copiloto · Mi cartera';
  route();
}
$('#btn-out').onclick=async()=>{await sb.auth.signOut();S.user=null;location.hash='';viewLogin();};
window.addEventListener('hashchange',route);
(async()=>{const {data}=await sb.auth.getSession(); if(data.session) await afterLogin(); else viewLogin();})();
</script>
</body>
