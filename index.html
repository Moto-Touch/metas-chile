<script>
(() => {
'use strict';
const SUPA_URL = 'https://noskbefdrtayhwydlbfx.supabase.co';
const SUPA_KEY = 'sb_publishable_5aLhvx4RAy5yqmRuLz4-zg_ZfuEppFV';
const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);
const TABS = ['portafolio','meta','variable','metas','checklist','bitacora'];
const TRAMO_LBL = {1:'Base',2:'Medio',3:'Alto'};

const S = {
  mode: 'loading', yo: null,
  periodos: [], periodo: null, prev: null,
  base: null, work: null,
  metas: null, compPeriodo: null, metasFiltro: {cuenta:'', q:''}, margen: 0,
  check: null, foto: null, offReason: '', loadError: null,
  tramoFiltro: 'miden', vistaPort: 'nacional', cuentaCat: '', busy: false, importPrev: null,
};

// ---------- utilidades ----------
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf0 = new Intl.NumberFormat('es-CL',{maximumFractionDigits:0});
const nf1 = new Intl.NumberFormat('es-CL',{minimumFractionDigits:1,maximumFractionDigits:1});
const N = (v) => v == null || v === '' || isNaN(+v) ? null : +v;
const fN = (v) => N(v) == null ? '—' : nf0.format(+v);
const fCLP = (v) => N(v) == null ? '—' : '$' + nf0.format(+v);
const fP = (v) => N(v) == null ? '—' : nf1.format(+v * 100) + '%';
const toPctInput = (v) => N(v) == null ? '' : +(+v * 100).toFixed(2);
const fromPctInput = (s) => s === '' || s == null ? null : +(+s / 100).toFixed(6);
const same = (a, b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);
const clone = (o) => JSON.parse(JSON.stringify(o ?? null));
const pago5 = (precio) => N(precio) == null ? null : Math.round(+precio * 0.05 / 500) * 500;
function store(k, v){ try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch(e){ return null; } }
function toast(msg){ const t = document.createElement('div'); t.className='toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 3500); }
const fW = (w) => w ? String(w).slice(0,4) + ' W' + String(w).slice(4) : '—';
const perKey = (p) => p ? p.anio + '|' + p.nombre : '';
const perLbl = (p) => p ? p.nombre + ' ' + p.anio : '—';
const cname = (id) => (((S.base && S.base.cuentas) || []).find(c => String(c.id) === String(id)) || {}).nombre || ('cuenta ' + id);
const RO = () => !(S.yo && S.yo.rol === 'editor');

// ---------- acceso a TRADE (Supabase Auth + RPC) ----------
async function rpc(fn, args){
  const { data, error } = await sb.rpc(fn, args || {});
  if (error) throw error;
  return data;
}
function errMsg(e){
  const m = (e && (e.message || e.error_description || e.msg)) || String(e);
  if (/Usuario sin acceso/.test(m)) return 'Tu usuario existe pero no tiene acceso a esta aplicación. Pide a Motorola que lo habilite.';
  if (/solo lectura/.test(m)) return 'Tu usuario es de solo lectura.';
  if (/JWT|expired|Invalid Refresh/i.test(m)) return 'La sesión venció. Vuelve a iniciar sesión.';
  if (/statement timeout/i.test(m)) return 'TRADE tardó demasiado en responder. Vuelve a intentar.';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Sin conexión con TRADE. Revisa tu red y vuelve a intentar.';
  if (/Invalid login credentials/i.test(m)) return 'Correo o contraseña incorrectos.';
  return m;
}
// ---------- carga ----------
function pickParams(r){ return {gate:N(r.gate_volumen_pct), peso_medio:N(r.peso_medio), peso_alto:N(r.peso_alto), piso:N(r.piso_tramo_pct), techo:N(r.techo_tramo_pct), umbral90:N(r.regla90_umbral), masivo_x: r.masivo_max_diario == null ? null : +r.masivo_max_diario, masivo_desc: r.masivo_descuenta_cumplimiento, estado: r.estado, notas: r.notas || ''}; }
function pickPMeta(r){ return {semanas: r.semanas == null ? null : +r.semanas, gfk:N(r.factor_gfk), share_def:N(r.share_objetivo_default), piso_desempeno: !!r.piso_desempeno, evento: r.evento_nombre || '', alza_medio:N(r.alza_medio_pct), alza_medio_extra:N(r.alza_medio_extra_pct), alza_alto:N(r.alza_alto_pct), min_sig: r.min_signature_alto == null ? 0 : +r.min_signature_alto, f_fuera:N(r.factor_stock_fuera_meta), por_stock: !!r.reparto_por_stock, notas: r.notas || ''}; }
function pickTramo(r){ return {match: r.market_name_match, tramo: +r.tramo, sp: !!r.es_super_premium, pago: N(r.pago_unidad_sp), vigencia: r.vigencia, mide: r.mide !== false, cuentas: {}}; }
function pickMoto(r){ return {precio: N(r.precio_lista), pago: N(r.pago_unidad), regla: r.regla, nota: r.nota || ''}; }
function pickRegla(r){ return {prod:N(r.piso_productividad_dia), tope:N(r.tope_share_piso), min_b:N(r.min_base), min_m:N(r.min_medio), min_a:N(r.min_alto), max_a:N(r.max_alto), sig:r.min_signature_sin_stock == null ? null : +r.min_signature_sin_stock, por_venta: !!r.reparto_por_venta, motivo: r.motivo || ''}; }
const EMPTY_REGLA = () => ({prod:null, tope:null, min_b:null, min_m:null, min_a:null, max_a:null, sig:null, por_venta:false, motivo:''});
const reglaVacia = (r) => !r || (r.prod==null && r.tope==null && r.min_b==null && r.min_m==null && r.min_a==null && r.max_a==null && r.sig==null && !r.por_venta);
function normBase(d){
  const arr = (x) => Array.isArray(x) ? x : [];
  const base = {
    params: d.params ? pickParams(d.params) : null, params_prev: d.params_prev ? pickParams(d.params_prev) : null,
    pmeta: d.pmeta ? pickPMeta(d.pmeta) : null, pmeta_prev: d.pmeta_prev ? pickPMeta(d.pmeta_prev) : null,
    tramos: Object.fromEntries(arr(d.tramos).map(r => [r.modelo_nombre, pickTramo(r)])),
    tramos_prev: Object.fromEntries(arr(d.tramos_prev).map(r => [r.modelo_nombre, pickTramo(r)])),
    master: Object.fromEntries(arr(d.master).map(r => [r.modelo_nombre, r])),
    moto: Object.fromEntries(arr(d.moto).map(r => [r.accesorio, pickMoto(r)])),
    moto_prev: Object.fromEntries(arr(d.moto_prev).map(r => [r.accesorio, pickMoto(r)])),
    cuentas: arr(d.cuentas),
    stc: Object.fromEntries(arr(d.stc).map(r => [r.cuenta_id, {b:N(r.pct_base), m:N(r.pct_medio), a:N(r.pct_alto), desde: r.periodo_nombre + ' ' + r.anio, propio: r.anio === S.periodo.anio && r.periodo_nombre === S.periodo.nombre}])),
    rango: Object.fromEntries(arr(d.rango).map(r => [r.cuenta_id, {min:N(r.share_min), max:N(r.share_max), motivo:r.motivo || '', desde: r.periodo_nombre + ' ' + r.anio, propio: r.anio === S.periodo.anio && r.periodo_nombre === S.periodo.nombre}])),
    regla: Object.fromEntries(arr(d.regla).map(r => [r.cuenta_id, pickRegla(r)])),
    headcount: Object.fromEntries(arr(d.headcount).map(r => [r.cargo, +r.n])),
    semanas: Object.fromEntries(arr(d.stock && d.stock.semanas).map(r => [String(r.cuenta_id), r])),
    stock: Object.fromEntries(arr(d.stock && d.stock.stock).map(r => [r.cuenta_id + '|' + r.modelo, r])),
    otros: arr(d.stock && d.stock.otros),
    metas_periodos: arr(d.metas_periodos),

function draftProblems(){
  const p = [], w = S.work; if (!w) return p;
  if (w.params) { if (Math.abs((w.params.peso_medio ?? 0) + (w.params.peso_alto ?? 0) - 1) > 1e-6) p.push('Los pesos de Medio y Alto deben sumar 100%.'); if (w.params.piso != null && w.params.piso > 1) p.push('El piso por tramo no puede superar 100%.'); if (w.params.techo != null && w.params.techo < 1) p.push('El techo por tramo no puede ser menor a 100%.'); }

const COLS = {codigo:['código tienda','codigo tienda'], tipo:['tipo oct','tipo nov','tipo dic','tipo'], tam:['tam oct proyectado','tam nov proyectado','tam dic proyectado','tam proyectado'], meta:['meta oct','meta nov','meta dic','meta total'], base:['meta base'], medio:['meta medio'], alto:['meta alta','meta alto'], share:['share esperado'], cadena:['cadena'], tienda:['tienda']};
function readBase(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { try {
      const wb = XLSX.read(fr.result, {type:'array'});
      const name = wb.SheetNames.find(n => n.toLowerCase().trim() === 'base tiendas') || wb.SheetNames[0];
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, defval:null});
      let hi = rows.findIndex(r => r && r.some(c => typeof c === 'string' && c.toLowerCase().trim() === 'código tienda'));
      if (hi < 0) throw new Error('No encontré la fila de encabezados con "Código tienda" en la hoja ' + name);
      const hdr = rows[hi].map(c => String(c ?? '').toLowerCase().trim());
      const idx = {}; for (const [k, names] of Object.entries(COLS)) { let j = -1; for (const n of names) { j = hdr.findIndex(h => h === n); if (j >= 0) break; } if (j < 0) { const pref = names[0].replace(/ (oct|nov|dic)\b.*/,''); j = hdr.findIndex(h => h.startsWith(pref)); } idx[k] = j; }
      const falt = ['codigo','meta','base','medio','alto'].filter(k => idx[k] < 0); if (falt.length) throw new Error('Faltan columnas: ' + falt.join(', '));
      const out = [];
      for (const r of rows.slice(hi + 1)) { if (!r || !r[idx.codigo]) continue; const tipo = idx.tipo >= 0 ? String(r[idx.tipo] ?? '').toLowerCase() : ''; if (tipo && !tipo.includes('con promotor')) continue; out.push({codigo:String(r[idx.codigo]).trim(), cadena: idx.cadena>=0 ? r[idx.cadena] : null, tienda: idx.tienda>=0 ? r[idx.tienda] : null, tam: idx.tam>=0 ? N(r[idx.tam]) : null, meta: N(r[idx.meta]), base: N(r[idx.base]), medio: N(r[idx.medio]), alto: N(r[idx.alto]), share: idx.share>=0 ? N(r[idx.share]) : null}); }
      res({hoja: name, filas: out, conTipo: idx.tipo >= 0});
    } catch(e) { rej(e); } };
    fr.onerror = () => rej(new Error('No se pudo leer el archivo'));
    fr.readAsArrayBuffer(file);
  });
}
function actImportar(prev){
  const tot = prev.filas.reduce((s, f) => s + (f.meta || 0), 0);
  openModal({title:`Importar ${prev.filas.length} tiendas a ${perLbl(S.periodo)}`, intro:`Hoja <b>${esc(prev.hoja)}</b>${prev.conTipo ? ', solo filas con promotor' : ''}: ${esc(fN(tot))} unidades de meta. Las tiendas se cruzan por código (id_local, con variantes Movistar/Hites). Las metas quedan en TRADE como <b>importada_base_touch</b>, en borrador; si vuelves a generar en TRADE, se reemplazan.`, needMotivo: true, confirmLbl:'Importar',
    onConfirm: async (motivo) => { const r = await rpc('app_importar', {p_anio: S.periodo.anio, p_periodo: S.periodo.nombre, p_filas: prev.filas, p_motivo: motivo}); toast(r ? `Importadas ${r.importadas}; sin tienda ${r.sin_tienda}; sin cobertura ${r.sin_cobertura}` : 'Importación hecha'); S.importPrev = null; if (r && r.sin_tienda) S.importAviso = `Códigos sin tienda en TRADE: ${r.codigos_sin_match}`; await Promise.all([loadMetas(), loadCheck()]); render(); }});

function ejemploPool(){
  const w = S.work.params; if (!w) return '';
  const pool = 300000, pm = pool * (w.peso_medio ?? .5), pa = pool * (w.peso_alto ?? .5);
  const pagoTramo = (c, base, puedeSobre) => { if (c < (w.piso ?? .75)) return 0; const tope = puedeSobre ? Math.min(c, w.techo ?? 1.2) : Math.min(c, 1); return base * tope; };
  const casos = [[0.8,1.15],[1.1,0.95],[1.1,0.85],[0.6,1.1]].map(([m,a]) => { const alto = pagoTramo(a, pa, true); const medio = pagoTramo(m, pm, a >= (w.umbral90 ?? .9)); return {m, a, medio, alto, tot: medio + alto}; });
  return `<details class="group"><summary><b>Prueba de reglas</b><span class="muted">Casos A–D del documento con pool de $300.000 y gate cumplido, calculados con el borrador</span></summary><div class="tbl"><table><thead><tr><th class="num">Medio</th><th class="num">Alto</th><th class="num">Pago Medio</th><th class="num">Pago Alto</th><th class="num">Pool</th></tr></thead><tbody>${casos.map(c => `<tr><td class="num">${fP(c.m)}</td><td class="num">${fP(c.a)}</td><td class="num">${fCLP(c.medio)}</td><td class="num">${fCLP(c.alto)}</td><td class="num"><b>${fCLP(c.tot)}</b></td></tr>`).join('')}</tbody></table></div></details>`;
}

  const cuentas = [...new Set(filas.map(f => f.cuenta))];

  return `<section class="panel"><div class="panel-head"><h2>Metas de ${esc(perLbl(S.periodo))}</h2><div class="ctrl"><label class="lbl" for="sel-comp">Comparar con</label><select id="sel-comp"><option value="">Sin comparación</option>${compOpts}</select></div></div>

    ${!conMeta.length ? `<div class="banner warn"><p>${esc(perLbl(S.periodo))} todavía no tiene metas en TRADE. Importa la Base de trabajo de Touch o genera con el motor de TRADE.</p></div>` : ''}

    <div class="tbl"><table><thead><tr><th>Cuenta</th><th class="num">Tiendas</th><th class="num">Meta total</th><th class="num">Base</th><th class="num">Medio</th><th class="num">Alto</th><th class="num">% Alto</th><th class="num">${comp ? esc(perLbl(comp)) : 'Comp.'}</th><th class="num">Δ</th><th></th></tr></thead><tbody>${resumen || '<tr><td colspan="10" class="empty">Sin tiendas.</td></tr>'}</tbody></table></div></section>
  <section class="panel"><div class="panel-head"><h2>Detalle por tienda</h2><div class="ctrl"><label class="lbl" for="f-cuenta">Cuenta</label><select id="f-cuenta"><option value="">Todas</option>${cuentas.map(c => `<option ${c===fc?'selected':''}>${esc(c)}</option>`).join('')}</select><input id="f-q" placeholder="Buscar tienda, código o promotor" value="${esc(S.metasFiltro.q)}"></div></div>
    <p class="hint">Una fila por tienda. Dos promotores en una tienda responden cada uno contra la meta completa. Medio y Alto pagan el pool; Base solo suma al Gate.</p>
    <div class="tbl tall"><table><thead><tr><th>Cuenta</th><th>Tienda y promotores</th><th class="num">TAM</th><th class="num">Share hist.</th><th class="num">Share obj.</th><th class="num">Meta</th><th class="num">Base</th><th class="num">Medio</th><th class="num">Alto</th><th class="num">${comp ? esc(comp.nombre) : 'Comp.'}</th><th class="num">Δ</th><th>Notas</th></tr></thead><tbody>${detRows || '<tr><td colspan="12" class="empty">Sin resultados.</td></tr>'}</tbody></table></div></section>`;
}
function panelOverrides(){
  const b = S.base, w = S.work, filas = S.metas.filas, tn = (id) => (filas.find(f => String(f.tienda_id) === String(id)) || {});
  const rows = [];
  for (const [k, lbl] of [['ovr_meta','Meta total'],['ovr_tam','TAM']]) for (const id of new Set([...Object.keys(b[k]||{}), ...Object.keys(w[k]||{})])) { const x = (b[k]||{})[id], y = (w[k]||{})[id], f = tn(id);
    if (!y) { rows.push(`<tr class="removed"><td>${esc(f.cuenta||'')}</td><td>${esc(f.tienda||id)}</td><td>${lbl}</td><td colspan="2">Se quita</td><td><button class="link" data-undo-ovr="${k}|${id}">Deshacer</button></td></tr>`); continue; }
    rows.push(`<tr class="${!same(x, y)?'changed':''}"><td>${esc(f.cuenta||'')}</td><td><b>${esc(f.tienda||id)}</b></td><td>${lbl}</td><td class="num"><input type="number" min="0" step="1" data-ovr="${k}|${id}" data-f="valor" value="${y.valor ?? ''}" aria-label="Valor" ${RO()?'disabled':''}></td><td><input data-ovr="${k}|${id}" data-f="motivo" class="w-l" value="${esc(y.motivo)}" aria-label="Motivo" ${RO()?'disabled':''}></td><td>${RO() ? '' : `<button class="link danger" data-del-ovr="${k}|${id}">Quitar</button>`}</td></tr>`); }
  const opts = filas.filter(f => f.n_cob > 0).map(f => `<option value="${f.tienda_id}">${esc(f.cuenta + ' · ' + f.tienda)}</option>`).join('');
  return `<details class="group" ${rows.length?'open':''}><summary><b>Ajustes manuales</b><span class="muted">Overrides con motivo para el motor de TRADE; entran al volver a generar</span></summary><div>
    <div class="tbl"><table><thead><tr><th>Cuenta</th><th>Tienda</th><th>Tipo</th><th class="num">Valor (u)</th><th>Motivo</th><th></th></tr></thead><tbody>${rows.join('') || `<tr><td colspan="6" class="muted">Sin ajustes manuales.</td></tr>`}</tbody></table></div>
    ${RO() ? '' : `<div class="addrow"><div class="f"><label class="lbl" for="n-ovr-t">Tienda</label><select id="n-ovr-t"><option value="">Elige tienda…</option>${opts}</select></div><div class="f"><label class="lbl" for="n-ovr-k">Tipo</label><select id="n-ovr-k"><option value="ovr_meta">Meta total</option><option value="ovr_tam">TAM</option></select></div><div class="f"><label class="lbl" for="n-ovr-v">Valor (u)</label><input id="n-ovr-v" type="number" min="0" step="1" style="width:100px"></div><div class="f"><label class="lbl" for="n-ovr-m">Motivo</label><input id="n-ovr-m" class="w-l"></div><button id="b-add-ovr">Agregar ajuste</button></div>`}</div></details>`;
}

// ----- Checklist -----
function viewCheck(){
  const C = S.check; if (!C) return '<div class="empty">Cargando checklist…</div>'; if (C.error) return `<div class="banner bad"><p>${esc(C.error)}</p></div>`;
  const b = S.base, items = [], add = (sev, cat, det) => items.push({sev, cat, det});
  if (b.params.estado !== 'confirmado') add('warning','Supuestos','Los supuestos siguen en borrador.');
  if (b.params.masivo_x == null) add('warning','Masivos','Falta definir el máximo diario de unidades antes de presumir masivo (X).');
  if (b.params.masivo_desc == null) add('warning','Masivos','Falta definir si los masivos descuentan del cumplimiento.');
  if (!b.pmeta) add('error','Construcción de la meta','No hay reglas de construcción de la meta para el período.');
  else { if (b.pmeta.semanas == null) add('error','Construcción de la meta','Faltan las semanas del ciclo.'); if (b.pmeta.gfk == null) add('error','Construcción de la meta','Falta el factor GfK del mes.'); if (b.pmeta.evento && !(b.pmeta.alza_medio || b.pmeta.alza_alto)) add('warning','Construcción de la meta',`Hay evento (${b.pmeta.evento}) pero las alzas están en 0.`); }
  for (const [k, m] of Object.entries(b.moto)) if (m.precio == null) add('info','Motothings', `${k}: precio de lista pendiente; se paga ${fCLP(m.pago)} manual.`);
  const difs = Object.entries(b.tramos).filter(([k, t]) => b.master[k] && b.master[k].tramo !== t.tramo);
  if (difs.length) add('info','Portafolio', `${difs.length} modelo(s) con tramo distinto al master: ${difs.map(([k,t]) => k + ' (' + TRAMO_LBL[b.master[k].tramo] + ' → ' + TRAMO_LBL[t.tramo] + ')').join(', ')}.`);
  const noMaster = Object.keys(b.tramos).filter(k => !b.master[k]); if (noMaster.length) add('info','Portafolio', `${noMaster.join(', ')} no está(n) en el master de TRADE.`);
  for (const r of C.sin_clasificar || []) add('warning','Modelos sin clasificar', `${r.market_name}: ${fN(r.venta_4s)} u vendidas en 4 semanas y ${fN(r.stock_ult)} en stock, sin tramo ni Motothings en el período.`);
  for (const [key, r] of Object.entries(b.stock || {})) { const [cid, modelo] = key.split('|'); const t = b.tramos[modelo]; if (!t || N(r.prom) == null || r.prom < 20 || estadoEn(t, cid)) continue; add('info','Stock fuera de meta', `${cname(cid)} · ${modelo}: ${fN(r.prom)} u en ${r.tiendas} tiendas con promotor (${fW((b.semanas[cid]||{}).semana)}), y el modelo no mide ahí. Entra al ajuste por stock fuera de meta.`); }
  for (const [cid, s] of Object.entries(b.semanas || {})) { if (!b.cuentas.some(c => String(c.id) === cid)) continue; if (s.ultima && s.semana && s.ultima > s.semana) add('info','Semana de stock', `${cname(cid)}: se usa ${fW(s.semana)}; la última cargada (${fW(s.ultima)}) se ve parcial.`); }
  const nAccSinCargo = b.headcount['(sin categoría)'] || 0; if (nAccSinCargo) add('warning','Promotores', `${nAccSinCargo} promotores vigentes sin categoría (cargo_bono) en su ficha.`);
  const n = changes().length; if (n && !RO()) add('warning','Borrador', `${n} cambio(s) sin aplicar en esta página.`);
  const sevOrder = {error:0, warning:1, info:2};
  const off = (C.oficial || []).map(r => ({sev: r.severidad, cat: r.categoria.replace(/_/g,' '), det: `${r.cuenta_nombre ? r.cuenta_nombre + ' · ' : ''}${r.tienda_nombre ? r.tienda_nombre + ': ' : ''}${r.detalle}`}));
  const all = [...items, ...off].sort((x, y) => (sevOrder[x.sev] ?? 3) - (sevOrder[y.sev] ?? 3));
  const cnt = (s) => all.filter(i => i.sev === s).length, groups = {}; for (const i of all) (groups[i.sev + '|' + i.cat] = groups[i.sev + '|' + i.cat] || []).push(i);
  const pc = (s) => s === 'error' ? 'bad' : s === 'warning' ? 'warn' : 'acc';
  const body = Object.entries(groups).map(([k, arr]) => { const [sev, cat] = k.split('|'); return `<details class="group" ${sev==='error'&&arr.length<=12?'open':''}><summary><span class="pill ${pc(sev)}">${sev === 'error' ? 'Error' : sev === 'warning' ? 'Aviso' : 'Info'}</span><b>${esc(cat)}</b><span class="muted">${arr.length}</span></summary><div><ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px">${arr.slice(0, 200).map(i => `<li>${esc(i.det)}</li>`).join('')}${arr.length > 200 ? `<li class="muted">y ${arr.length - 200} más</li>` : ''}</ul></div></details>`; }).join('');
  return `<section class="panel"><div class="panel-head"><h2>Checklist pre-entrega · ${esc(perLbl(S.periodo))}</h2>${RO() ? '' : '<button id="b-recheck">Volver a revisar</button>'}</div>
    <div class="statgrid"><div class="stat"><b>${cnt('error')}</b><span>errores que bloquean la entrega</span></div><div class="stat"><b>${cnt('warning')}</b><span>avisos para revisar</span></div><div class="stat"><b>${cnt('info')}</b><span>informativos</span></div></div>
    <p class="hint">Junta <span class="kbd">checklist_pre_entrega</span> de TRADE con las validaciones de los supuestos. "Modelos sin clasificar" mira la última semana con dato${C.semana_ref ? ' (' + esc(String(C.semana_ref).slice(0,4) + ' W' + String(C.semana_ref).slice(4)) + ')' : ''}.</p>
    ${body || '<div class="empty">Todo en orden.</div>'}</section>`;
}
function viewLog(){
  const L = (S.check && S.check.log) || [], fmt = (v) => v == null ? '—' : typeof v === 'object' ? Object.entries(v).map(([k, x]) => `${k}: ${x == null ? '—' : typeof x === 'object' ? JSON.stringify(x) : x}`).join(' · ') : String(v);
  return `<section class="panel"><div class="panel-head"><h2>Bitácora de ${esc(perLbl(S.periodo))}</h2><span class="muted">Cada escritura hecha desde esta página, con su motivo</span></div>

// ---------- eventos ----------
function changed(){ saveDraft(); renderHeader(); renderMain(); }
function readFld(el, kind){ return kind === 'pct' ? fromPctInput(el.value) : kind === 'int' ? (el.value === '' ? null : Math.round(+el.value)) : kind === 'num' ? (el.value === '' ? null : +el.value) : kind === 'bool' ? (el.value === '' ? null : el.value === 'true') : el.value; }

      if (e.target.value === 'nacional') { if (sug) delete t.cuentas[cid]; else t.cuentas[cid] = {estado: t.mide ? 'Mide' : 'No mide', motivo: 'existe sin stock'}; } else t.cuentas[cid] = {estado: e.target.value, motivo: ''}; changed(); });

      if (e.target.value === 'no') t.cuentas[cid] = {estado: 'No existe', motivo: ''};
      else if (sug) delete t.cuentas[cid]; else t.cuentas[cid] = {estado: t.mide ? 'Mide' : 'No mide', motivo: 'existe sin stock'}; changed(); });
    on('[data-add-otro]', 'click', (e) => { const mn = e.target.dataset.addOtro; const nombre = mn.replace(/^motorola\s+|^moto\s+/i, '').replace(/\b5g\b/i, '').trim().replace(/\b\w/g, c => c.toUpperCase()); if (S.work.tramos[nombre]) { toast('Ya está en el portafolio'); return; } S.work.tramos[nombre] = {match: mn, tramo: 1, sp: false, pago: null, vigencia: 'Vigente', mide: true, cuentas: {}}; toast(`${nombre} agregado como Base; ajusta el tramo en la vista Nacional`); changed(); });
    on('[data-tramo]', 'change', (e) => { const el = e.target, t = S.work.tramos[el.dataset.tramo], f = el.dataset.f;
      if (f === 'tramo') { t.tramo = +el.value; if (t.tramo !== 3) { t.sp = false; t.pago = null; } } else if (f === 'sp') { t.sp = el.checked; t.pago = t.sp ? (t.pago ?? 20000) : null; } else if (f === 'pago') t.pago = el.value === '' ? null : +el.value; else if (f === 'mide') { t.mide = el.checked; if (!t.mide) { t.sp = false; t.pago = null; } } else t[f] = el.value; changed(); });
    on('[data-semana]', 'change', (e) => { const id = e.target.dataset.semana, v = +e.target.value, s = S.base.semanas[id]; if (v === s.sugerida && !s.fuente) delete S.work.semana[id]; else S.work.semana[id] = v; changed(); });
    on('[data-cell]', 'click', (e) => { const [k, cid] = e.currentTarget.dataset.cell.split('|'); const t = S.work.tramos[k]; t.cuentas = t.cuentas || {}; if (t.cuentas[cid]) delete t.cuentas[cid]; else t.cuentas[cid] = {estado: t.mide ? 'No mide' : 'Mide', motivo: ''}; changed(); });
    on('[data-add-exc]', 'change', (e) => { const k = e.target.dataset.addExc, id = e.target.value; if (!id) return; const t = S.work.tramos[k]; t.cuentas = t.cuentas || {}; t.cuentas[id] = {estado: t.mide ? 'No mide' : 'Mide', motivo: ''}; changed(); });
    on('[data-exc]', 'change', (e) => { const [k, id] = e.target.dataset.exc.split('|'); S.work.tramos[k].cuentas[id].estado = e.target.value; changed(); });
    on('[data-del-exc]', 'click', (e) => { const [k, id] = e.target.dataset.delExc.split('|'); delete S.work.tramos[k].cuentas[id]; changed(); });
    on('[data-del-tramo]', 'click', (e) => { const k = e.target.dataset.delTramo; if (S.base.tramos[k]) S.work.tramos[k] = null; else delete S.work.tramos[k]; changed(); });
    on('[data-undo-tramo]', 'click', (e) => { const k = e.target.dataset.undoTramo; S.work.tramos[k] = clone(S.base.tramos[k]); changed(); });
    const bn = $('#b-nuevo'); if (bn) bn.onclick = () => { S.nuevoAbierto = true; renderMain(); const el = $('#n-modelo'); if (el) el.focus(); };
    const bnc = $('#b-nuevo-cerrar'); if (bnc) bnc.onclick = () => { S.nuevoAbierto = false; renderMain(); };
    const bat = $('#b-add-tramo'); if (bat) bat.onclick = () => { const m = $('#n-modelo').value.trim(), mt = $('#n-match').value.trim().toLowerCase(), t = +$('#n-tramo').value, mide = $('#n-mide').value === 'true', vig = $('#n-vig').value, sp = $('#n-sp').value;
      if (!m || !mt) { toast('Escribe el modelo y su nombre de mercado'); return; } if (S.work.tramos[m]) { toast('Ese modelo ya está'); return; }
      const dup = Object.entries(S.work.tramos).find(([k, x]) => x && (x.match||'').toLowerCase() === mt); if (dup) { toast(`Ese nombre de mercado ya lo usa ${dup[0]}`); return; }
      S.work.tramos[m] = {match: mt, tramo: mide ? t : 1, sp: mide && t === 3 && !!sp, pago: mide && t === 3 && sp ? +sp : null, vigencia: vig, mide, cuentas: {}}; S.nuevoAbierto = false; toast(`${m} agregado al borrador`); changed(); };
    on('[data-moto]', 'change', (e) => { const el = e.target, m = S.work.moto[el.dataset.moto], f = el.dataset.f; if (f === 'precio') m.precio = el.value === '' ? null : +el.value; else if (f === 'pago') m.pago = el.value === '' ? null : +el.value; else m[f] = el.value; if (m.regla === '5pct_lista') { if (m.precio == null) { m.regla = 'manual'; toast('Sin precio de lista el pago queda manual'); } else m.pago = pago5(m.precio); } changed(); });
    on('[data-del-moto]', 'click', (e) => { const k = e.target.dataset.delMoto; if (S.base.moto[k]) S.work.moto[k] = null; else delete S.work.moto[k]; changed(); });
    on('[data-undo-moto]', 'click', (e) => { const k = e.target.dataset.undoMoto; S.work.moto[k] = clone(S.base.moto[k]); changed(); });
    const bam = $('#b-add-moto'); if (bam) bam.onclick = () => { const a = $('#n-acc').value.trim(), p = $('#n-precio').value; if (!a) { toast('Escribe el nombre del accesorio'); return; } if (S.work.moto[a]) { toast('Ese accesorio ya está'); return; } const precio = p === '' ? null : +p; S.work.moto[a] = {precio, pago: precio == null ? 0 : pago5(precio), regla: precio == null ? 'manual' : '5pct_lista', nota: precio == null ? 'precio pendiente' : ''}; changed(); };
  }
  if (tab === 'meta') {
    on('[id^="m-"][data-fld]', 'change', (e) => { const el = e.target; S.work.pmeta[el.dataset.fld] = readFld(el, el.dataset.kind); changed(); });
    on('[data-rango]', 'change', (e) => { const el = e.target, id = el.dataset.rango; const r = S.work.rango[id] = S.work.rango[id] || {min:null, max:null, motivo:''}; if (el.dataset.f === 'motivo') r.motivo = el.value; else r[el.dataset.f] = fromPctInput(el.value); changed(); });
    on('[data-regla]', 'change', (e) => { const el = e.target, id = el.dataset.regla, f = el.dataset.f; const r = S.work.regla[id] = S.work.regla[id] || EMPTY_REGLA(); if (f === 'motivo') r.motivo = el.value; else if (f === 'por_venta') r.por_venta = el.checked; else if (f === 'tope') r.tope = fromPctInput(el.value); else r[f] = el.value === '' ? null : +el.value; changed(); });
    on('[data-stc]', 'change', (e) => { const el = e.target; S.work.stc[el.dataset.stc][el.dataset.f] = fromPctInput(el.value) ?? 0; changed(); });
    on('[data-add-stc]', 'click', (e) => { S.work.stc[e.target.dataset.addStc] = {b:.5, m:.4, a:.1}; changed(); });
  }
  if (tab === 'variable') on('[id^="v-"][data-fld]', 'change', (e) => { const el = e.target, k = el.dataset.fld, w = S.work.params; w[k] = readFld(el, el.dataset.kind); if (k === 'peso_medio' && w.peso_medio != null) w.peso_alto = +(1 - w.peso_medio).toFixed(6); changed(); });
  if (tab === 'metas') {
    const sc = $('#sel-comp'); if (sc) sc.onchange = async (e) => { const v = e.target.value; S.compPeriodo = v ? {anio: +v.split('|')[0], nombre: v.split('|')[1]} : null; if (S.mode === 'live') { S.busy = true; renderHeader(); await loadMetas(); S.busy = false; } render(); };
    const fcu = $('#f-cuenta'); if (fcu) fcu.onchange = (e) => { S.metasFiltro.cuenta = e.target.value; renderMain(); };
    const fq = $('#f-q'); if (fq) fq.onchange = (e) => { S.metasFiltro.q = e.target.value; renderMain(); };
    const im = $('#in-margen'); if (im) im.onchange = (e) => { S.margen = fromPctInput(e.target.value) || 0; };
    const bg = $('#b-generar'); if (bg) bg.onclick = actGenerar; const bcf = $('#b-confirmar'); if (bcf) bcf.onclick = actConfirmarMetas;
    const fx = $('#f-xlsx'); if (fx) fx.onchange = async (e) => { const f = e.target.files[0]; if (!f) return; S.importError = null; S.importAviso = null; try { if (typeof XLSX === 'undefined') throw new Error('La librería de Excel no cargó; recarga la página.'); S.importPrev = await readBase(f); if (!S.importPrev.filas.length) throw new Error('No encontré filas con promotor en la hoja.'); } catch(err) { S.importPrev = null; S.importError = err.message || String(err); } renderMain(); };
    const bi = $('#b-import'); if (bi) bi.onclick = () => actImportar(S.importPrev);
    on('[data-ovr]', 'change', (e) => { const [k, id] = e.target.dataset.ovr.split('|'); const o = S.work[k][id]; if (e.target.dataset.f === 'valor') o.valor = e.target.value === '' ? null : +e.target.value; else o.motivo = e.target.value; changed(); });
    on('[data-del-ovr]', 'click', (e) => { const [k, id] = e.target.dataset.delOvr.split('|'); if ((S.base[k]||{})[id]) S.work[k][id] = null; else delete S.work[k][id]; changed(); });
    on('[data-undo-ovr]', 'click', (e) => { const [k, id] = e.target.dataset.undoOvr.split('|'); S.work[k][id] = clone(S.base[k][id]); changed(); });
    const bao = $('#b-add-ovr'); if (bao) bao.onclick = () => { const t = $('#n-ovr-t').value, k = $('#n-ovr-k').value, v = $('#n-ovr-v').value, m = $('#n-ovr-m').value.trim(); if (!t || v === '' || !m) { toast('Elige tienda, valor y motivo'); return; } S.work[k][t] = {valor: +v, motivo: m}; changed(); };
  }
  if (tab === 'checklist') { const br = $('#b-recheck'); if (br) br.onclick = async () => { S.busy = true; renderHeader(); await loadCheck(); S.busy = false; render(); }; }
}
$('#sel-periodo').addEventListener('change', (e) => { const [a, n] = e.target.value.split('|'); S.periodo = {anio: +a, nombre: n}; store('periodo', S.periodo); S.compPeriodo = null; S.metas = null; S.check = null; S.importPrev = null; S.importAviso = null; loadAll(true); });
window.addEventListener('hashchange', () => { renderTabs(); renderMain(); });

function renderLogin(){
  $('#main').innerHTML = `<form class="login" id="f-login"><h1>Metas y Variable Chile</h1><p class="hint" style="margin:0">Acceso para Motorola Chile y Touch. Entra con el correo y la contraseña que te asignaron.</p>
    <div class="f" style="display:flex;flex-direction:column;gap:4px"><label class="lbl" for="l-email">Correo</label><input id="l-email" type="email" autocomplete="username" required></div>
    <div class="f" style="display:flex;flex-direction:column;gap:4px"><label class="lbl" for="l-pass">Contraseña</label><input id="l-pass" type="password" autocomplete="current-password" required></div>
    <div id="l-err" hidden class="banner bad"><p></p></div>
    <button class="primary" type="submit" id="l-ok">Entrar</button></form>`;
  $('#f-login').onsubmit = async (e) => { e.preventDefault(); $('#l-ok').disabled = true; $('#l-ok').textContent = 'Entrando…';
    try { const { error } = await sb.auth.signInWithPassword({email: $('#l-email').value.trim(), password: $('#l-pass').value}); if (error) throw error; await afterLogin(); }
    catch(err) { const b = $('#l-err'); b.hidden = false; b.querySelector('p').textContent = errMsg(err); $('#l-ok').disabled = false; $('#l-ok').textContent = 'Entrar'; } };
}
async function logout(){ try { await sb.auth.signOut(); } catch(e) {} S.yo = null; S.base = null; S.mode = 'login'; render(); }
async function afterLogin(){
  S.mode = 'loading'; render();
  try { S.yo = await rpc('app_yo'); } catch(e) { S.yo = null; }
  if (!S.yo) { await sb.auth.signOut().catch(() => {}); S.mode = 'login'; render(); const b = $('#l-err'); if (b) { b.hidden = false; b.querySelector('p').textContent = 'Tu usuario existe pero no tiene acceso a esta aplicación. Pide a Motorola que lo habilite.'; } return; }
  await loadAll(true);
}
async function boot(){
  renderTabs();
  S.periodo = store('periodo') || {anio: 2026, nombre: 'Noviembre'};
  const { data } = await sb.auth.getSession();
  if (data && data.session) await afterLogin(); else { S.mode = 'login'; render(); }
  sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT' && S.mode !== 'login') { S.yo = null; S.mode = 'login'; render(); } });
}
boot();
})();
</script>
</body></html>
