const r0 = (v) => { const n = N(v); return n == null ? null : Math.round(n); };

function draftProblems(){
  const p = [], w = S.work; if (!w) return p;
  if (w.params) { if (Math.abs((w.params.peso_medio ?? 0) + (w.params.peso_alto ?? 0) - 1) > 1e-6) p.push('Los pesos de Medio y Alto deben sumar 100%.'); if (w.params.piso != null && w.params.piso > 1) p.push('El piso por tramo no puede superar 100%.'); if (w.params.techo != null && w.params.techo < 1) p.push('El techo por tramo no puede ser menor a 100%.'); }

  for (const [m, t] of Object.entries(w.tramos)) if (t) { if (t.sp && t.tramo !== 3) p.push(`${m}: Super Premium solo puede estar en tramo Alto.`); if (t.sp && N(t.pago) == null) p.push(`${m}: falta el pago por unidad de Super Premium.`); if (t.sp && !t.mide) p.push(`${m}: un Super Premium tiene que medir.`); if (!t.match) p.push(`${m}: falta el nombre de mercado.`); }

    <div id="m-err" hidden class="banner bad"><p></p></div>

  const close = () => { root.innerHTML = ''; };

  $('#m-ok').onclick = async () => {
    const motivo = needMotivo ? $('#m-motivo').value.trim() : '';

const COLS = {codigo:['código tienda','codigo tienda'], tipo:['tipo nov','tipo dic','tipo ene','tipo feb','tipo mar','tipo abr','tipo may','tipo jun','tipo jul','tipo ago','tipo sep','tipo oct','tipo'], tam:['tam nov proyectado','tam dic proyectado','tam ene proyectado','tam feb proyectado','tam mar proyectado','tam abr proyectado','tam may proyectado','tam jun proyectado','tam jul proyectado','tam ago proyectado','tam sep proyectado','tam oct proyectado','tam proyectado'], meta:['meta nov','meta dic','meta ene','meta feb','meta mar','meta abr','meta may','meta jun','meta jul','meta ago','meta sep','meta oct','meta total'], base:['meta base'], medio:['meta medio'], alto:['meta alta','meta alto'], share:['share esperado','share objetivo'], cadena:['cadena'], tienda:['tienda'], supervisor:['supervisor'], zona:['zona'], merchandiser:['merchandiser'], ingram:['ingram (encargado)','ingram'], cluster:['cluster']};
const TIPO_LBL = {con_promotor:'Con promotor', supervisor:'Sin promotor · supervisor', otras:'Otras (merchandiser / INGRAM)'};
const PER_MES = {Enero:'ene',Febrero:'feb',Marzo:'mar',Abril:'abr',Mayo:'may',Junio:'jun',Julio:'jul',Agosto:'ago',Septiembre:'sep',Octubre:'oct',Noviembre:'nov',Diciembre:'dic'};
function readBase(file){
  const mes = PER_MES[S.periodo.nombre] || '';
  const pick = (hdr, names) => { const pri = names.filter(n => mes && n.includes(' ' + mes)); for (const n of [...pri, ...names]) { const j = hdr.findIndex(h => h === n); if (j >= 0) return j; } const pref = names[0].replace(/ (ene|feb|mar|abr|may|jun|jul|ago|sep|oct|nov|dic)\b.*/,''); return hdr.findIndex(h => h.startsWith(pref)); };
  const leerHoja = (wb, name, tipoFijo) => {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, defval:null});
    const hi = rows.findIndex(r => r && r.some(c => typeof c === 'string' && c.toLowerCase().trim() === 'código tienda'));
    if (hi < 0) throw new Error('No encontré la fila de encabezados con "Código tienda" en la hoja ' + name);
    const hdr = rows[hi].map(c => String(c ?? '').toLowerCase().trim());
    const idx = {}; for (const [k, names] of Object.entries(COLS)) idx[k] = pick(hdr, names);
    const falt = ['codigo','meta','base','medio','alto'].filter(k => idx[k] < 0); if (falt.length) throw new Error(`Hoja ${name}: faltan columnas ${falt.join(', ')}`);
    const g = (r, k) => idx[k] >= 0 ? r[idx[k]] : null;
    const out = [];
    for (const r of rows.slice(hi + 1)) { if (!r || !r[idx.codigo]) continue;
      const t = String(g(r, 'tipo') ?? '').toLowerCase();
      const tipo = tipoFijo || (t.includes('otras') ? 'otras' : t.includes('con promotor') ? 'con_promotor' : t.includes('sin promotor') ? 'supervisor' : t ? 'supervisor' : 'con_promotor');
      out.push({codigo:String(r[idx.codigo]).trim(), tipo, cadena: g(r,'cadena'), tienda: g(r,'tienda'), tam: N(g(r,'tam')), meta: N(g(r,'meta')), base: N(g(r,'base')), medio: N(g(r,'medio')), alto: N(g(r,'alto')), share: N(g(r,'share')),
        supervisor: g(r,'supervisor'), zona: g(r,'zona'), merchandiser: g(r,'merchandiser'), ingram: g(r,'ingram'), cluster: g(r,'cluster')}); }
    return out;
  };
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { try {
      const wb = XLSX.read(fr.result, {type:'array'});
      const hoja = (n) => wb.SheetNames.find(s => s.toLowerCase().trim() === n);
      const base = hoja('base tiendas'), otras = hoja('otras tiendas'), propia = hoja('tiendas');
      let filas, formato;
      if (base) {
        formato = 'Base de trabajo Touch';
        filas = leerHoja(wb, base, null);
        const vistos = new Set(filas.map(f => f.codigo));
        if (otras) for (const f of leerHoja(wb, otras, 'otras')) if (!vistos.has(f.codigo)) { filas.push(f); vistos.add(f.codigo); }
      } else if (propia) {
        formato = 'Excel exportado desde esta herramienta';
        filas = leerHoja(wb, propia, null);
        const dup = filas.length - new Set(filas.map(f => f.codigo)).size; if (dup) throw new Error(`La hoja Tiendas tiene ${dup} códigos repetidos; deja una fila por tienda.`);
      } else throw new Error('No reconozco el archivo: debe tener la hoja "Base Tiendas" (Base de trabajo Touch) o la hoja "Tiendas" (exportada desde aquí).');
      const malas = filas.filter(f => f.meta != null && Math.abs((f.base||0) + (f.medio||0) + (f.alto||0) - f.meta) > 1).length;
      const porTipo = {}; for (const f of filas) { const p = porTipo[f.tipo] = porTipo[f.tipo] || {n:0, u:0}; p.n++; p.u += f.meta || 0; }
      res({hoja: base ? base + (otras ? ' + ' + otras : '') : propia, formato, filas, porTipo, malas});
    } catch(e) { rej(e); } };
    fr.onerror = () => rej(new Error('No se pudo leer el archivo'));
    fr.readAsArrayBuffer(file);
  });
}
function actImportar(prev){
  const tot = prev.filas.reduce((s, f) => s + (f.meta || 0), 0);
  const desglose = Object.entries(prev.porTipo || {}).map(([t, p]) => `${TIPO_LBL[t] || t}: ${p.n} tiendas · ${fN(p.u)} u`).join(' · ');
  openModal({title:`Importar ${prev.filas.length} tiendas a ${perLbl(S.periodo)}`, intro:`<b>${esc(prev.formato)}</b> · hoja ${esc(prev.hoja)}: ${esc(fN(tot))} unidades de meta. ${esc(desglose)}.${prev.malas ? ` <b>Ojo:</b> en ${prev.malas} tiendas Base + Medio + Alto no suma la meta total.` : ''} Las tiendas se cruzan por código (id_local, con variantes Movistar/Hites). Cada meta queda marcada por tipo (con promotor / supervisor / otras) y se guarda la asignación de supervisor, zona y merchandiser del período. Las metas quedan en TRADE como <b>importada_base_touch</b>, en borrador; las importadas antes del mismo tipo que ya no vengan en el archivo se quitan.`, needMotivo: true, confirmLbl:'Importar',

// ---------- actualizar TAM desde archivo ----------
function cargarTam(file){
  return new Promise((res, rej) => {
    if (typeof XLSX === 'undefined') { rej(new Error('La librería de Excel no cargó; recarga la página.')); return; }
    const fr = new FileReader();
    fr.onload = () => { try {
      const wb = XLSX.read(fr.result, {type:'array'});
      const norm = (s) => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
      let hoja = null, hi = -1, hdr = null;
      for (const n of [wb.SheetNames.find(s => norm(s) === 'tiendas'), ...wb.SheetNames].filter(Boolean)) { const rows = XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, defval:null}); const i = rows.findIndex(r => r && r.some(c => /^(codigo tienda|codigo|id_local|cod\. tienda|cod tienda)$/.test(norm(c))) && r.some(c => /^tam/.test(norm(c)))); if (i >= 0) { hoja = {n, rows}; hi = i; hdr = rows[i].map(norm); break; } }
      if (!hoja) throw new Error('No encontré una hoja con columnas "Código tienda" y "TAM".');
      const iCod = hdr.findIndex(c => /^(codigo tienda|codigo|id_local|cod\. tienda|cod tienda)$/.test(c)), iCad = hdr.findIndex(c => c === 'cadena' || c === 'cuenta');
      const tamCols = hdr.map((c, i) => [c, i]).filter(([c]) => /^tam/.test(c));
      const pref = tamCols.find(([c]) => /proyect/.test(c) && /(nov|dic|ene|feb|mar|abr|may|jun|jul|ago|sep|oct)/.test(c)) || tamCols.find(([c]) => c === 'tam') || tamCols.find(([c]) => !/ref/.test(c)) || tamCols[0];
      const iTam = pref[1], semanal = /semanal/.test(pref[0]), ns = nSem(S.periodo) || 4;
      const filas = S.metas.filas.filter(f => N(f.meta_total) != null), byCod = new Map(filas.map(f => [norm(f.id_local), f])), bySuf = new Map();
      for (const f of filas) { const s = norm(String(f.id_local).split('::').pop()); bySuf.set(s, bySuf.has(s) ? null : f); }
      let ok = 0, igual = 0, sinMeta = [], sinTam = 0; S.work.mt = S.work.mt || {};
      for (const r of hoja.rows.slice(hi + 1)) { if (!r || r[iCod] == null || r[iCod] === '') continue;
        const cod = norm(r[iCod]), cad = iCad >= 0 ? norm(r[iCad]) : '';
        const f = byCod.get(cod) || (cad ? byCod.get(cad + '::' + cod) || byCod.get(cad + '::cl25_' + cod) : null) || bySuf.get(cod.split('::').pop()) || byCod.get(cod.replace(/\.0$/, ''));
        let t = N(r[iTam]); if (t == null) { sinTam++; continue; } if (!f) { sinMeta.push(String(r[iCod])); continue; }
        if (semanal) t = t * ns; t = Math.round(t * 10) / 10;
        const id = String(f.tienda_id), x = mtBase(id), cur = mtCur(id); if (!x) continue;
        if (cur.tam != null && Math.abs(cur.tam - t) < 0.05) { igual++; continue; }
        const tot0 = cur.b + cur.m + cur.a, ratio = cur.tam ? tot0 / cur.tam : N(f.share_obj);
        let y; if (ratio == null) y = Object.assign({}, cur, {tam: t}); else { const [b, m, a] = repartir(Math.round(t * ratio), [cur.b, cur.m, cur.a]); y = {tam: t, b, m, a}; }
        if (same(x, y)) delete S.work.mt[id]; else S.work.mt[id] = y; ok++; }
      const partes = [`<b>${ok}</b> tiendas con TAM nuevo pasaron al borrador (hoja ${esc(hoja.n)}, columna <i>${esc(pref[0])}</i>${semanal ? ` × ${ns} semanas` : ''})`];
      if (igual) partes.push(`${igual} ya tenían ese TAM`); if (sinTam) partes.push(`${sinTam} filas sin TAM`);
      if (sinMeta.length) partes.push(`${sinMeta.length} códigos sin meta en ${esc(perLbl(S.periodo))}: ${esc(sinMeta.slice(0, 12).join(', '))}${sinMeta.length > 12 ? '…' : ''}`);
      res({bad: !ok, txt: partes.join(' · ') + (ok ? '. Revisa el detalle y usa <b>Revisar y aplicar</b>.' : '.')});
    } catch(e) { rej(e); } };
    fr.onerror = () => rej(new Error('No se pudo leer el archivo'));
    fr.readAsArrayBuffer(file);
  });
}

function exportMetas(){
  if (typeof XLSX === 'undefined') { toast('La librería de Excel no cargó; recarga la página.'); return; }
  const filas = (S.metas && S.metas.filas) || [], per = perInfo(S.periodo), ns = nSem(S.periodo) || null;
  const r0 = (v) => { const n = N(v); return n == null ? null : Math.round(n); };
  const pc = (v) => { const n = N(v); return n == null ? null : Math.round(n * 1000) / 1000; };
  const tl = (t) => TIPO_LBL[t || 'con_promotor'] || t;
  const orden = {con_promotor: 0, supervisor: 1, otras: 2};
  const fs = filas.filter(f => N(f.meta_total) != null).sort((a, b) => (orden[a.tipo||'con_promotor'] - orden[b.tipo||'con_promotor']) || String(a.cuenta).localeCompare(b.cuenta) || String(a.tienda).localeCompare(b.tienda));
  const det = fs.map(f => ({
    'Tipo': tl(f.tipo), 'Cuenta': f.cuenta, 'Código tienda': f.id_local, 'Tienda': f.tienda,
    'Supervisor': f.supervisor || '', 'Zona': f.zona || '', 'Merchandiser': f.merchandiser || '', 'INGRAM': f.ingram || '', 'Cluster': f.cluster || '',
    'Promotores vigentes': f.promotores || '', 'TAM': r0(f.tam), 'Share histórico': pc(f.share_hist), 'Share objetivo': pc(f.share_obj),
    'Meta total': r0(f.meta_total), 'Meta Base': r0(f.meta_base), 'Meta Medio': r0(f.meta_medio), 'Meta Alto': r0(f.meta_alto),
    'Meta semanal': ns ? Math.round((N(f.meta_total) || 0) / ns * 10) / 10 : null,
    'Método': f.metodo_meta === 'importada_base_touch' ? 'Importada Base Touch' : (f.metodo_meta || ''), 'Estado': f.estado || '',
    'Sin cobertura en TRADE': (f.tipo || 'con_promotor') === 'con_promotor' && f.n_cob === 0 ? 'Sí' : ''
  }));
  const agg = (keyFn, cols) => { const m = new Map(); for (const f of fs) { const k = keyFn(f); if (k == null) continue; const a = m.get(k) || {n:0, t:0, b:0, me:0, al:0}; a.n++; a.t += N(f.meta_total)||0; a.b += N(f.meta_base)||0; a.me += N(f.meta_medio)||0; a.al += N(f.meta_alto)||0; m.set(k, a); } return [...m.entries()].map(([k, a]) => Object.assign(cols(k), {'Tiendas': a.n, 'Meta total': Math.round(a.t), 'Meta Base': Math.round(a.b), 'Meta Medio': Math.round(a.me), 'Meta Alto': Math.round(a.al), '% Alto': a.t ? Math.round(a.al / a.t * 1000) / 1000 : null, 'Meta semanal': ns ? Math.round(a.t / ns) : null})); };
  const resCuenta = agg(f => (f.tipo||'con_promotor') + '|' + f.cuenta, k => { const [t, c] = k.split('|'); return {'Tipo': tl(t), 'Cuenta': c}; }).sort((a, b) => a.Tipo.localeCompare(b.Tipo) || a.Cuenta.localeCompare(b.Cuenta));
  const sup = new Map(); for (const f of fs) { const t = f.tipo || 'con_promotor'; if (t === 'otras') continue; const k = f.supervisor || '(sin supervisor)'; const s = sup.get(k) || {zona: f.zona || '', cp:0, mcp:0, sp:0, msp:0}; if (!s.zona && f.zona) s.zona = f.zona; if (t === 'con_promotor') { s.cp++; s.mcp += N(f.meta_total)||0; } else { s.sp++; s.msp += N(f.meta_total)||0; } sup.set(k, s); }
  const resSup = [...sup.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([k, s]) => ({'Supervisor': k, 'Zona': s.zona, 'Tiendas con promotor': s.cp, 'Meta con promotor': Math.round(s.mcp), 'Tiendas sin promotor': s.sp, 'Meta sin promotor': Math.round(s.msp), 'Meta zona': Math.round(s.mcp + s.msp), 'Meta zona semanal': ns ? Math.round((s.mcp + s.msp) / ns) : null}));
  const info = [['Metas ' + perLbl(S.periodo)], ['Ciclo', cicloTxt(S.periodo)], ['Semanas', ns], ['Tiendas con meta', fs.length],
    ...['con_promotor','supervisor','otras'].map(t => { const x = fs.filter(f => (f.tipo||'con_promotor') === t); return [tl(t), x.length + ' tiendas', Math.round(x.reduce((s, f) => s + (N(f.meta_total)||0), 0)) + ' u']; }),
    ['Fuente', 'TRADE (meta_promotor_mensual) · exportado ' + new Date().toLocaleString('es-CL')], ['Nota', 'Base solo suma al Gate; Medio y Alto pagan. Las tiendas "Otras" no suman a supervisores ni al variable.']];
  const wb = XLSX.utils.book_new();
  const sh = (rows, widths) => { const ws = XLSX.utils.json_to_sheet(rows); ws['!cols'] = widths.map(w => ({wch: w})); if (rows.length) ws['!autofilter'] = {ref: ws['!ref']}; return ws; };
  XLSX.utils.book_append_sheet(wb, sh(det, [24,11,20,32,28,18,26,18,7,40,8,9,9,9,8,8,8,9,20,10,10]), 'Tiendas');
  XLSX.utils.book_append_sheet(wb, sh(resCuenta, [26,12,8,10,9,9,9,7,10]), 'Resumen por cuenta');
  XLSX.utils.book_append_sheet(wb, sh(resSup, [32,20,10,10,10,10,10,10]), 'Supervisores');
  const wi = XLSX.utils.aoa_to_sheet(info); wi['!cols'] = [{wch: 30}, {wch: 60}, {wch: 12}]; XLSX.utils.book_append_sheet(wb, wi, 'Info');
  XLSX.writeFile(wb, `Metas_${S.periodo.nombre}_${S.periodo.anio}.xlsx`);

function ejemploPool(){
  const w = S.work.params; if (!w) return '';
  const pool = 300000, pm = pool * (w.peso_medio ?? .5), pa = pool * (w.peso_alto ?? .5);
  const pagoTramo = (c, base, puedeSobre) => { if (c < (w.piso ?? .75)) return 0; const tope = puedeSobre ? Math.min(c, w.techo ?? 1.2) : Math.min(c, 1); return base * tope; };
  const casos = [[0.8,1.15],[1.1,0.95],[1.1,0.85],[0.6,1.1]].map(([m,a]) => { const alto = pagoTramo(a, pa, true); const medio = pagoTramo(m, pm, a >= (w.umbral90 ?? .9)); return {m, a, medio, alto, tot: medio + alto}; });
  return `<details class="group"><summary><b>Prueba de reglas</b><span class="muted">Casos A–D del documento con pool de $300.000 y gate cumplido, calculados con el borrador</span></summary><div class="tbl"><table><thead><tr><th class="num">Medio</th><th class="num">Alto</th><th class="num">Pago Medio</th><th class="num">Pago Alto</th><th class="num">Pool</th></tr></thead><tbody>${casos.map(c => `<tr><td class="num">${fP(c.m)}</td><td class="num">${fP(c.a)}</td><td class="num">${fCLP(c.medio)}</td><td class="num">${fCLP(c.alto)}</td><td class="num"><b>${fCLP(c.tot)}</b></td></tr>`).join('')}</tbody></table></div></details>`;
}

function viewCheck(){

  const b = S.base, items = [], add = (sev, cat, det) => items.push({sev, cat, det});
  if (b.params.estado !== 'confirmado') add('warning','Supuestos','Los supuestos siguen en borrador.');
  if (b.params.masivo_x == null) add('warning','Masivos','Falta definir el máximo diario de unidades antes de presumir masivo (X).');
  if (b.params.masivo_desc == null) add('warning','Masivos','Falta definir si los masivos descuentan del cumplimiento.');
  if (!b.pmeta) add('error','Construcción de la meta','No hay reglas de construcción de la meta para el período.');
  else { if (b.pmeta.semanas == null) add('error','Construcción de la meta','Faltan las semanas del ciclo.'); if (b.pmeta.gfk == null) add('error','Construcción de la meta','Falta el factor GfK del mes.'); if (b.pmeta.evento && !(b.pmeta.alza_medio || b.pmeta.alza_alto)) add('warning','Construcción de la meta',`Hay evento (${b.pmeta.evento}) pero las alzas están en 0.`); }

  if (difs.length) add('info','Portafolio', `${difs.length} modelo(s) con tramo distinto al master: ${difs.map(([k,t]) => k + ' (' + TRAMO_LBL[b.master[k].tramo] + ' → ' + TRAMO_LBL[t.tramo] + ')').join(', ')}.`);
  const noMaster = Object.keys(b.tramos).filter(k => !b.master[k]); if (noMaster.length) add('info','Portafolio', `${noMaster.join(', ')} no está(n) en el master de TRADE.`);

  const nAccSinCargo = b.headcount['(sin categoría)'] || 0; if (nAccSinCargo) add('warning','Promotores', `${nAccSinCargo} promotores vigentes sin categoría (cargo_bono) en su ficha.`);
  const n = changes().length; if (n && !RO()) add('warning','Borrador', `${n} cambio(s) sin aplicar en esta página.`);
  const sevOrder = {error:0, warning:1, info:2};
  const off = (C.oficial || []).map(r => ({sev: r.severidad, cat: r.categoria.replace(/_/g,' '), det: `${r.cuenta_nombre ? r.cuenta_nombre + ' · ' : ''}${r.tienda_nombre ? r.tienda_nombre + ': ' : ''}${r.detalle}`}));

  const body = Object.entries(groups).map(([k, arr]) => { const [sev, cat] = k.split('|'); return `<details class="group" ${sev==='error'&&arr.length<=12?'open':''}><summary><span class="pill ${pc(sev)}">${sev === 'error' ? 'Error' : sev === 'warning' ? 'Aviso' : 'Info'}</span><b>${esc(cat)}</b><span class="muted">${arr.length}</span></summary><div><ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px">${arr.slice(0, 200).map(i => `<li>${esc(i.det)}</li>`).join('')}${arr.length > 200 ? `<li class="muted">y ${arr.length - 200} más</li>` : ''}</ul></div></details>`; }).join('');

    <div class="statgrid"><div class="stat"><b>${cnt('error')}</b><span>errores que bloquean la entrega</span></div><div class="stat"><b>${cnt('warning')}</b><span>avisos para revisar</span></div><div class="stat"><b>${cnt('info')}</b><span>informativos</span></div></div>

    ${body || '<div class="empty">Todo en orden.</div>'}</section>`;

      S.work.tramos[m] = {match: mt, tramo: mide ? t : 1, sp: mide && t === 3 && !!sp, pago: mide && t === 3 && sp ? +sp : null, vigencia: vig, mide, cuentas: {}}; S.nuevoAbierto = false; toast(`${m} agregado al borrador`); changed(); };
    on('[data-moto-existe]', 'change', (e) => { const k = e.target.dataset.motoExiste, cid = String(S.cuentaCat), m = S.work.moto[k]; m.cuentas = m.cuentas || {}; const sug = motoExisteSug(cid, k); const want = e.target.value === 'si'; if (want === sug) delete m.cuentas[cid]; else m.cuentas[cid] = {estado: want ? 'Existe' : 'No existe', motivo: ''}; changed(); });
    on('[data-moto]', 'change', (e) => { const el = e.target, m = S.work.moto[el.dataset.moto], f = el.dataset.f; if (f === 'precio') m.precio = el.value === '' ? null : +el.value; else if (f === 'pago') m.pago = el.value === '' ? null : +el.value; else if (f === 'mide') m.mide = el.checked; else m[f] = el.value; if (m.regla === '5pct_lista') { if (m.precio == null) { m.regla = 'manual'; toast('Sin precio de lista el pago queda manual'); } else m.pago = pago5(m.precio); } changed(); });
    on('[data-del-moto]', 'click', (e) => { const k = e.target.dataset.delMoto; if (S.base.moto[k]) S.work.moto[k] = null; else delete S.work.moto[k]; changed(); });
    on('[data-undo-moto]', 'click', (e) => { const k = e.target.dataset.undoMoto; S.work.moto[k] = clone(S.base.moto[k]); changed(); });
    const bam = $('#b-add-moto'); if (bam) bam.onclick = () => { const a = $('#n-acc').value.trim(), p = $('#n-precio').value, mt = ($('#n-acc-match').value.trim() || a).toLowerCase(); if (!a) { toast('Escribe el nombre del accesorio'); return; } if (S.work.moto[a]) { toast('Ese accesorio ya está'); return; } const precio = p === '' ? null : +p; S.work.moto[a] = {precio, pago: precio == null ? 0 : pago5(precio), regla: precio == null ? 'manual' : '5pct_lista', nota: precio == null ? 'precio pendiente' : '', match: mt, vigencia: 'Vigente', mide: true, cuentas: {}}; changed(); };
  }
  if (tab === 'meta') {
    on('[id^="m-"][data-fld]', 'change', (e) => { const el = e.target; S.work.pmeta[el.dataset.fld] = readFld(el, el.dataset.kind); changed(); });
    on('[data-rango]', 'change', (e) => { const el = e.target, id = el.dataset.rango; const r = S.work.rango[id] = S.work.rango[id] || {min:null, max:null, motivo:''}; if (el.dataset.f === 'motivo') r.motivo = el.value; else r[el.dataset.f] = fromPctInput(el.value); changed(); });
    on('[data-regla]', 'change', (e) => { const el = e.target, id = el.dataset.regla, f = el.dataset.f; const r = S.work.regla[id] = S.work.regla[id] || EMPTY_REGLA(); if (f === 'motivo') r.motivo = el.value; else if (f === 'por_venta') r.por_venta = el.checked; else if (f === 'tope') r.tope = fromPctInput(el.value); else r[f] = el.value === '' ? null : +el.value; changed(); });
    on('[data-stc]', 'change', (e) => { const el = e.target; S.work.stc[el.dataset.stc][el.dataset.f] = fromPctInput(el.value) ?? 0; changed(); });
    on('[data-add-stc]', 'click', (e) => { S.work.stc[e.target.dataset.addStc] = {b:.5, m:.4, a:.1}; changed(); });
  }
  if (tab === 'variable') on('[id^="v-"][data-fld]', 'change', (e) => { const el = e.target, k = el.dataset.fld, w = S.work.params; w[k] = readFld(el, el.dataset.kind); if (k === 'peso_medio' && w.peso_medio != null) w.peso_alto = +(1 - w.peso_medio).toFixed(6); changed(); });
  if (tab === 'metas') {
    const sc = $('#sel-comp'); if (sc) sc.onchange = async (e) => { const v = e.target.value; S.compPeriodo = v ? {anio: +v.split('|')[0], nombre: v.split('|')[1]} : null; if (S.mode === 'live') { S.busy = true; renderHeader(); await loadMetas(); S.busy = false; } render(); };
    const fcu = $('#f-cuenta'); if (fcu) fcu.onchange = (e) => { S.metasFiltro.cuenta = e.target.value; renderMain(); };
    on('[data-mt]', 'change', (e) => { const [id, k] = e.target.dataset.mt.split('|'), x = mtBase(id); if (!x) return; const cur = mtCur(id); let y;
      if (k === 'tam') {
        const t = e.target.value === '' ? null : Math.max(0, Math.round(+e.target.value * 10) / 10), f = S.metas.filas.find(r => String(r.tienda_id) === id), tot0 = cur.b + cur.m + cur.a;
        const ratio = cur.tam ? tot0 / cur.tam : N(f && f.share_obj);
        if (t == null || ratio == null) y = Object.assign({}, cur, {tam: t});
        else { const [b, m, a] = repartir(Math.round(t * ratio), [cur.b, cur.m, cur.a]); y = {tam: t, b, m, a}; }
      } else y = Object.assign({}, cur, {[k]: Math.max(0, Math.round(+e.target.value || 0))}); S.work.mt = S.work.mt || {}; if (same(x, y)) delete S.work.mt[id]; else S.work.mt[id] = y; changed(); });
    const fti = $('#f-tipo'); if (fti) fti.onchange = (e) => { S.metasFiltro.tipo = e.target.value; renderMain(); };
    const fun = $('#sel-uni'); if (fun) fun.onchange = (e) => { S.metasFiltro.universo = e.target.value; renderMain(); };
    const fq = $('#f-q'); if (fq) fq.onchange = (e) => { S.metasFiltro.q = e.target.value; renderMain(); };
    const im = $('#in-margen'); if (im) im.onchange = (e) => { S.margen = fromPctInput(e.target.value) || 0; };
    const bx = $('#b-xls'); if (bx) bx.onclick = exportMetas;
    const bg = $('#b-generar'); if (bg) bg.onclick = actGenerar; const bcf = $('#b-confirmar'); if (bcf) bcf.onclick = actConfirmarMetas;
    const ft2 = $('#f-tam'); if (ft2) ft2.onchange = async (e) => { const f = e.target.files[0]; if (!f) return; try { S.tamAviso = await cargarTam(f); } catch(err) { S.tamAviso = {bad: true, txt: esc(err.message || String(err))}; } changed(); };
    const bal = $('#b-alias'); if (bal) bal.onclick = () => { S.ma.sub = 'probar'; S.ma.txt = String(S.importSinMatch || '').split(/,\s*/).join('\n'); S.ma.res = null; location.hash = '#maestros'; renderTabs(); renderMain(); setTimeout(() => { const b = $('#ma-resolver'); if (b) b.click(); }, 300); };
    const fx = $('#f-xlsx'); if (fx) fx.onchange = async (e) => { const f = e.target.files[0]; if (!f) return; S.importError = null; S.importAviso = null; try { if (typeof XLSX === 'undefined') throw new Error('La librería de Excel no cargó; recarga la página.'); S.importPrev = await readBase(f); if (!S.importPrev.filas.length) throw new Error('No encontré tiendas con meta en el archivo.'); } catch(err) { S.importPrev = null; S.importError = err.message || String(err); } renderMain(); };
    const bi = $('#b-import'); if (bi) bi.onclick = () => actImportar(S.importPrev);
    on('[data-ovr]', 'change', (e) => { const [k, id] = e.target.dataset.ovr.split('|'); const o = S.work[k][id]; if (e.target.dataset.f === 'valor') o.valor = e.target.value === '' ? null : +e.target.value; else o.motivo = e.target.value; changed(); });
    on('[data-del-ovr]', 'click', (e) => { const [k, id] = e.target.dataset.delOvr.split('|'); if ((S.base[k]||{})[id]) S.work[k][id] = null; else delete S.work[k][id]; changed(); });
    on('[data-undo-ovr]', 'click', (e) => { const [k, id] = e.target.dataset.undoOvr.split('|'); S.work[k][id] = clone(S.base[k][id]); changed(); });
    const bao = $('#b-add-ovr'); if (bao) bao.onclick = () => { const t = $('#n-ovr-t').value, k = $('#n-ovr-k').value, v = $('#n-ovr-v').value, m = $('#n-ovr-m').value.trim(); if (!t || v === '' || !m) { toast('Elige tienda, valor y motivo'); return; } S.work[k][t] = {valor: +v, motivo: m}; changed(); };
  }
  if (tab === 'cobertura') bindCobertura();
  if (tab === 'checklist') { const br = $('#b-recheck'); if (br) br.onclick = async () => { S.busy = true; renderHeader(); await loadCheck(); S.busy = false; render(); }; }
}
$('#sel-periodo').addEventListener('change', (e) => { const [a, n] = e.target.value.split('|'); S.periodo = {anio: +a, nombre: n}; S.cob.loaded = false; S.cob.estado = null; S.cob.sel = {}; store('periodo', S.periodo); S.compPeriodo = null; S.metas = null; S.check = null; S.importPrev = null; S.importAviso = null; S.tamAviso = null; loadAll(true); });
window.addEventListener('hashchange', () => { renderTabs(); renderMain(); });

function renderLogin(){
  $('#main').innerHTML = `<form class="login" id="f-login"><h1>Metas y Variable Chile</h1><p class="hint" style="margin:0">Acceso para Motorola Chile y Touch. Entra con el correo y la contraseña que te asignaron.</p>
    <div class="f" style="display:flex;flex-direction:column;gap:4px"><label class="lbl" for="l-email">Correo</label><input id="l-email" type="email" autocomplete="username" required></div>
    <div class="f" style="display:flex;flex-direction:column;gap:4px"><label class="lbl" for="l-pass">Contraseña</label><input id="l-pass" type="password" autocomplete="current-password" required></div>
    <div id="l-err" hidden class="banner bad"><p></p></div>
    <button class="primary" type="submit" id="l-ok">Entrar</button></form>`;
  $('#f-login').onsubmit = async (e) => { e.preventDefault(); $('#l-ok').disabled = true; $('#l-ok').textContent = 'Entrando…';
    try { const { error } = await sb.auth.signInWithPassword({email: $('#l-email').value.trim(), password: $('#l-pass').value}); if (error) throw error; await afterLogin(); }
    catch(err) { const b = $('#l-err'); b.hidden = false; b.querySelector('p').textContent = errMsg(err); $('#l-ok').disabled = false; $('#l-ok').textContent = 'Entrar'; } };
}
async function logout(){ try { await sb.auth.signOut(); } catch(e) {} S.yo = null; S.base = null; S.mode = 'login'; render(); }
async function afterLogin(){
  S.mode = 'loading'; render();
  try { S.yo = await rpc('app_yo'); } catch(e) { S.yo = null; }
  if (!S.yo) { await sb.auth.signOut().catch(() => {}); S.mode = 'login'; render(); const b = $('#l-err'); if (b) { b.hidden = false; b.querySelector('p').textContent = 'Tu usuario existe pero no tiene acceso a esta aplicación. Pide a Motorola que lo habilite.'; } return; }
  await loadAll(true);
}
async function boot(){
  renderTabs();
  S.periodo = store('periodo') || {anio: 2026, nombre: 'Noviembre'};
  const { data } = await sb.auth.getSession();
  if (data && data.session) await afterLogin(); else { S.mode = 'login'; render(); }
  sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT' && S.mode !== 'login') { S.yo = null; S.mode = 'login'; render(); } });
}
boot();
})();
</script>
